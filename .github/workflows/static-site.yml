name: CI/CD

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/bykovas/trading-bot
  WORKER_IMAGE_NAME: ghcr.io/bykovas/trading-bot-worker

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build UI image
        run: |
          docker build \
            --tag "${IMAGE_NAME}:latest" \
            --tag "${IMAGE_NAME}:${{ github.sha }}" \
            .

      - name: Build worker image
        run: |
          docker build \
            --file src/TradingBot.Worker/Dockerfile \
            --tag "${WORKER_IMAGE_NAME}:latest" \
            --tag "${WORKER_IMAGE_NAME}:${{ github.sha }}" \
            .

      - name: Push images
        run: |
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${{ github.sha }}"
          docker push "${WORKER_IMAGE_NAME}:latest"
          docker push "${WORKER_IMAGE_NAME}:${{ github.sha }}"

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    env:
      IMAGE_NAME: ghcr.io/bykovas/trading-bot
      IMAGE_TAG: ${{ github.sha }}
      WORKER_IMAGE_NAME: ghcr.io/bykovas/trading-bot-worker
      WORKER_IMAGE_TAG: ${{ github.sha }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: bash infra/deploy.sh
