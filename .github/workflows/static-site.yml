name: CI/CD

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  UI_IMAGE_NAME: ghcr.io/bykovas/trading-bot-ui
  API_IMAGE_NAME: ghcr.io/bykovas/trading-bot-api
  WORKER_IMAGE_NAME: ghcr.io/bykovas/trading-bot-worker

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce worker changelog
        run: bash .ai/check-worker-changelog.sh "${{ github.event.before }}" "${{ github.sha }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build UI image
        run: |
          docker build \
            --tag "${UI_IMAGE_NAME}:latest" \
            --tag "${UI_IMAGE_NAME}:${{ github.sha }}" \
            .

      - name: Build worker image
        run: |
          WORKER_BUILD_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          WORKER_STRATEGY_VERSION="$(git ls-files src/TradingBot.Worker | sort | xargs sha256sum | sha256sum | cut -d ' ' -f1)"
          WORKER_CHANGE_SET="$(awk '/^## / {print $2; exit}' .ai/worker-changelog.md)"
          docker build \
            --file src/TradingBot.Worker/Dockerfile \
            --build-arg "TRADINGBOT_WORKER_VERSION=${{ github.sha }}" \
            --build-arg "TRADINGBOT_WORKER_COMMIT=${{ github.sha }}" \
            --build-arg "TRADINGBOT_WORKER_BUILD_UTC=${WORKER_BUILD_UTC}" \
            --build-arg "TRADINGBOT_WORKER_IMAGE_TAG=${{ github.sha }}" \
            --build-arg "TRADINGBOT_WORKER_STRATEGY_VERSION=${WORKER_STRATEGY_VERSION}" \
            --build-arg "TRADINGBOT_WORKER_CHANGE_SET=${WORKER_CHANGE_SET}" \
            --tag "${WORKER_IMAGE_NAME}:latest" \
            --tag "${WORKER_IMAGE_NAME}:${{ github.sha }}" \
            .

      - name: Build API image
        run: |
          docker build \
            --file src/TradingBot.Api/Dockerfile \
            --tag "${API_IMAGE_NAME}:latest" \
            --tag "${API_IMAGE_NAME}:${{ github.sha }}" \
            .

      - name: Push images
        run: |
          docker push "${UI_IMAGE_NAME}:latest"
          docker push "${UI_IMAGE_NAME}:${{ github.sha }}"
          docker push "${API_IMAGE_NAME}:latest"
          docker push "${API_IMAGE_NAME}:${{ github.sha }}"
          docker push "${WORKER_IMAGE_NAME}:latest"
          docker push "${WORKER_IMAGE_NAME}:${{ github.sha }}"

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: PROD

    env:
      UI_IMAGE_NAME: ghcr.io/bykovas/trading-bot-ui
      UI_IMAGE_TAG: ${{ github.sha }}
      API_IMAGE_NAME: ghcr.io/bykovas/trading-bot-api
      API_IMAGE_TAG: ${{ github.sha }}
      WORKER_IMAGE_NAME: ghcr.io/bykovas/trading-bot-worker
      WORKER_IMAGE_TAG: ${{ github.sha }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TRADINGBOT_DB_PASSWORD: ${{ secrets.TRADINGBOT_DB_PASSWORD }}
      TRADINGBOT_KRAKEN_API_KEY: ${{ secrets.TRADINGBOT_KRAKEN_API_KEY }}
      TRADINGBOT_KRAKEN_API_SECRET: ${{ secrets.TRADINGBOT_KRAKEN_API_SECRET }}
      TRADINGBOT_OPENAI_API_KEY: ${{ secrets.TRADINGBOT_OPENAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: bash infra/deploy.sh
