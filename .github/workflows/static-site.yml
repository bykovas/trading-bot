name: CI/CD

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  UI_IMAGE_NAME: ghcr.io/bykovas/trading-bot-ui
  API_IMAGE_NAME: ghcr.io/bykovas/trading-bot-api
  FUTURES_WORKER_IMAGE_NAME: ghcr.io/bykovas/trading-bot-futures-worker
  MARKET_DATA_WORKER_IMAGE_NAME: ghcr.io/bykovas/trading-bot-market-data-worker
  OG_IMAGE_NAME: ghcr.io/bykovas/trading-bot-og

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve per-component image tags
        run: |
          # An image is tagged with the last commit that touched what goes into it,
          # not with the commit being built. Two pushes that leave a component alone
          # resolve to the same tag, the registry already has it, the build is skipped
          # and compose sees an unchanged image reference - so the container is left
          # running. That is the point: a trading worker should not be restarted
          # mid-position because a stylesheet changed.
          #
          # The workflow itself is in every path list: a change to how images are built
          # invalidates all of them.
          CI=".github/workflows/static-site.yml"
          tag_for() {
            local sha
            sha="$(git log -1 --format=%H -- "$@" || true)"
            printf '%s' "${sha:-${{ github.sha }}}"
          }
          {
            echo "UI_IMAGE_TAG=$(tag_for Dockerfile nginx public "$CI")"
            echo "API_IMAGE_TAG=$(tag_for src/TradingBot.Api src/TradingBot.Core "$CI")"
            echo "FUTURES_WORKER_IMAGE_TAG=$(tag_for src/TradingBot.FuturesWorker src/TradingBot.Core "$CI")"
            echo "MARKET_DATA_WORKER_IMAGE_TAG=$(tag_for src/TradingBot.MarketDataWorker src/TradingBot.Core "$CI")"
            # equity-day.js is in both lists on purpose: it is one file shared by the
            # page and the card renderer, and a change to it moves both.
            echo "OG_IMAGE_TAG=$(tag_for tools/og-server.mjs tools/og-card.mjs tools/og-fonts.mjs tools/fonts tools/Dockerfile.og package.json package-lock.json public/equity-day.js public/assets "$CI")"
          } | tee infra/image-tags.env >> "$GITHUB_ENV"
          echo "Resolved image tags:"
          cat infra/image-tags.env

      - name: Enforce worker changelog
        run: bash .ai/check-worker-changelog.sh "${{ github.event.before }}" "${{ github.sha }}"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run tests
        run: dotnet test TradingBot.sln -c Release

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build UI image
        run: |
          if docker manifest inspect "${UI_IMAGE_NAME}:${UI_IMAGE_TAG}" >/dev/null 2>&1; then
            echo "UI unchanged since ${UI_IMAGE_TAG}; reusing the published image."
            exit 0
          fi
          docker build \
            --tag "${UI_IMAGE_NAME}:latest" \
            --tag "${UI_IMAGE_NAME}:${UI_IMAGE_TAG}" \
            .
          docker push "${UI_IMAGE_NAME}:${UI_IMAGE_TAG}"
          docker push "${UI_IMAGE_NAME}:latest"

      - name: Build futures worker image
        run: |
          if docker manifest inspect "${FUTURES_WORKER_IMAGE_NAME}:${FUTURES_WORKER_IMAGE_TAG}" >/dev/null 2>&1; then
            echo "Futures worker unchanged since ${FUTURES_WORKER_IMAGE_TAG}; reusing the published image."
            exit 0
          fi
          WORKER_BUILD_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          FUTURES_STRATEGY_VERSION="$(git ls-files src/TradingBot.Core src/TradingBot.FuturesWorker | sort | xargs sha256sum | sha256sum | cut -d ' ' -f1)"
          WORKER_CHANGE_SET="$(awk '/^## / {print $2; exit}' .ai/worker-changelog.md)"
          docker build \
            --file src/TradingBot.FuturesWorker/Dockerfile \
            --build-arg "TRADINGBOT_WORKER_VERSION=${FUTURES_WORKER_IMAGE_TAG}" \
            --build-arg "TRADINGBOT_WORKER_COMMIT=${FUTURES_WORKER_IMAGE_TAG}" \
            --build-arg "TRADINGBOT_WORKER_BUILD_UTC=${WORKER_BUILD_UTC}" \
            --build-arg "TRADINGBOT_WORKER_IMAGE_TAG=${FUTURES_WORKER_IMAGE_TAG}" \
            --build-arg "TRADINGBOT_WORKER_STRATEGY_VERSION=${FUTURES_STRATEGY_VERSION}" \
            --build-arg "TRADINGBOT_WORKER_CHANGE_SET=${WORKER_CHANGE_SET}" \
            --tag "${FUTURES_WORKER_IMAGE_NAME}:latest" \
            --tag "${FUTURES_WORKER_IMAGE_NAME}:${FUTURES_WORKER_IMAGE_TAG}" \
            .
          docker push "${FUTURES_WORKER_IMAGE_NAME}:${FUTURES_WORKER_IMAGE_TAG}"
          docker push "${FUTURES_WORKER_IMAGE_NAME}:latest"

      - name: Build market data worker image
        run: |
          if docker manifest inspect "${MARKET_DATA_WORKER_IMAGE_NAME}:${MARKET_DATA_WORKER_IMAGE_TAG}" >/dev/null 2>&1; then
            echo "market data worker unchanged since ${MARKET_DATA_WORKER_IMAGE_TAG}; reusing the published image."
            exit 0
          fi
          docker build \
            --file src/TradingBot.MarketDataWorker/Dockerfile \
            --tag "${MARKET_DATA_WORKER_IMAGE_NAME}:latest" \
            --tag "${MARKET_DATA_WORKER_IMAGE_NAME}:${MARKET_DATA_WORKER_IMAGE_TAG}" \
            .
          docker push "${MARKET_DATA_WORKER_IMAGE_NAME}:${MARKET_DATA_WORKER_IMAGE_TAG}"
          docker push "${MARKET_DATA_WORKER_IMAGE_NAME}:latest"

      - name: Build API image
        run: |
          if docker manifest inspect "${API_IMAGE_NAME}:${API_IMAGE_TAG}" >/dev/null 2>&1; then
            echo "API unchanged since ${API_IMAGE_TAG}; reusing the published image."
            exit 0
          fi
          docker build \
            --file src/TradingBot.Api/Dockerfile \
            --tag "${API_IMAGE_NAME}:latest" \
            --tag "${API_IMAGE_NAME}:${API_IMAGE_TAG}" \
            .
          docker push "${API_IMAGE_NAME}:${API_IMAGE_TAG}"
          docker push "${API_IMAGE_NAME}:latest"

      - name: Build og image
        run: |
          if docker manifest inspect "${OG_IMAGE_NAME}:${OG_IMAGE_TAG}" >/dev/null 2>&1; then
            echo "og renderer unchanged since ${OG_IMAGE_TAG}; reusing the published image."
            exit 0
          fi
          docker build \
            --file tools/Dockerfile.og \
            --tag "${OG_IMAGE_NAME}:latest" \
            --tag "${OG_IMAGE_NAME}:${OG_IMAGE_TAG}" \
            .
          docker push "${OG_IMAGE_NAME}:${OG_IMAGE_TAG}"
          docker push "${OG_IMAGE_NAME}:latest"

      - name: Upload deploy bundle
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          retention-days: 1
          path: |
            infra/deploy.sh
            infra/image-tags.env
            infra/docker-compose.prod.yml
            infra/traefik/trading-bot.yml
            src/TradingBot.FuturesWorker/appsettings.json
            src/TradingBot.FuturesWorker/appsettings.lukas.json
            src/TradingBot.MarketDataWorker/appsettings.json

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: self-hosted
    timeout-minutes: 10
    environment: PROD

    env:
      UI_IMAGE_NAME: ghcr.io/bykovas/trading-bot-ui
      API_IMAGE_NAME: ghcr.io/bykovas/trading-bot-api
      FUTURES_WORKER_IMAGE_NAME: ghcr.io/bykovas/trading-bot-futures-worker
      MARKET_DATA_WORKER_IMAGE_NAME: ghcr.io/bykovas/trading-bot-market-data-worker
      OG_IMAGE_NAME: ghcr.io/bykovas/trading-bot-og
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TRADINGBOT_DB_PASSWORD: ${{ secrets.TRADINGBOT_DB_PASSWORD }}
      TRADINGBOT_KRAKEN_API_KEY: ${{ secrets.TRADINGBOT_KRAKEN_API_KEY }}
      TRADINGBOT_KRAKEN_API_SECRET: ${{ secrets.TRADINGBOT_KRAKEN_API_SECRET }}
      TRADINGBOT_OPENAI_API_KEY: ${{ secrets.TRADINGBOT_OPENAI_API_KEY }}
      # Live trading is controlled from the PROD environment variable, never from
      # code: flipping it requires editing the GitHub environment, not a commit.
      TRADINGBOT_LIVE_TRADING_ENABLED: ${{ vars.TRADINGBOT_LIVE_TRADING_ENABLED }}
      TRADINGBOT_FUTURES_LIVE_TRADING_ENABLED: ${{ vars.TRADINGBOT_FUTURES_LIVE_TRADING_ENABLED }}
      TRADINGBOT_KRAKEN_FUTURES_API_KEY: ${{ secrets.TRADINGBOT_KRAKEN_FUTURES_API_KEY }}
      TRADINGBOT_KRAKEN_FUTURES_API_SECRET: ${{ secrets.TRADINGBOT_KRAKEN_FUTURES_API_SECRET }}
      TRADINGBOT_LUKAS_FUTURES_LIVE_TRADING_ENABLED: ${{ vars.TRADINGBOT_LUKAS_FUTURES_LIVE_TRADING_ENABLED }}
      TRADINGBOT_LUKAS_KRAKEN_FUTURES_API_KEY: ${{ secrets.TRADINGBOT_LUKAS_KRAKEN_FUTURES_API_KEY }}
      TRADINGBOT_LUKAS_KRAKEN_FUTURES_API_SECRET: ${{ secrets.TRADINGBOT_LUKAS_KRAKEN_FUTURES_API_SECRET }}
      # Announces each entry to the Telegram channel. Only futures-lukas-live gets it:
      # it is the account with its own signals, and the follower would post the same
      # trade a second time. Unset simply means the channel stays quiet.
      TRADINGBOT_TELEGRAM_BOT_TOKEN: ${{ secrets.TRADINGBOT_TELEGRAM_BOT_TOKEN }}
      # Optional: a keyed Base RPC for the coin rate. Unset falls back to the
      # public endpoints the API already rotates through. deploy.sh builds the
      # URL from the bare key.
      DRPC_API_KEY: ${{ secrets.DRPC_API_KEY }}

    steps:
      - name: Download deploy bundle
        uses: actions/download-artifact@v4
        with:
          name: deploy-bundle

      - name: Deploy
        run: |
          # Each component is pinned to the commit that last changed it, so compose
          # only recreates what actually moved. Without this every service would carry
          # this push's sha and every container would be restarted, workers included.
          set -a
          . ./infra/image-tags.env
          set +a
          bash infra/deploy.sh
