name: CI/CD

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  UI_IMAGE_NAME: ghcr.io/bykovas/trading-bot-ui
  API_IMAGE_NAME: ghcr.io/bykovas/trading-bot-api
  WEB_IMAGE_NAME: ghcr.io/bykovas/trading-bot-web
  SPOT_WORKER_IMAGE_NAME: ghcr.io/bykovas/trading-bot-spot-worker
  FUTURES_WORKER_IMAGE_NAME: ghcr.io/bykovas/trading-bot-futures-worker
  MARKET_DATA_WORKER_IMAGE_NAME: ghcr.io/bykovas/trading-bot-market-data-worker

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce worker changelog
        run: bash .ai/check-worker-changelog.sh "${{ github.event.before }}" "${{ github.sha }}"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run tests
        run: dotnet test TradingBot.sln -c Release

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build UI image
        run: |
          docker build \
            --tag "${UI_IMAGE_NAME}:latest" \
            --tag "${UI_IMAGE_NAME}:${{ github.sha }}" \
            .

      - name: Build spot worker image
        run: |
          WORKER_BUILD_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          WORKER_STRATEGY_VERSION="$(git ls-files src/TradingBot.Core src/TradingBot.SpotWorker | sort | xargs sha256sum | sha256sum | cut -d ' ' -f1)"
          WORKER_CHANGE_SET="$(awk '/^## / {print $2; exit}' .ai/worker-changelog.md)"
          docker build \
            --file src/TradingBot.SpotWorker/Dockerfile \
            --build-arg "TRADINGBOT_WORKER_VERSION=${{ github.sha }}" \
            --build-arg "TRADINGBOT_WORKER_COMMIT=${{ github.sha }}" \
            --build-arg "TRADINGBOT_WORKER_BUILD_UTC=${WORKER_BUILD_UTC}" \
            --build-arg "TRADINGBOT_WORKER_IMAGE_TAG=${{ github.sha }}" \
            --build-arg "TRADINGBOT_WORKER_STRATEGY_VERSION=${WORKER_STRATEGY_VERSION}" \
            --build-arg "TRADINGBOT_WORKER_CHANGE_SET=${WORKER_CHANGE_SET}" \
            --tag "${SPOT_WORKER_IMAGE_NAME}:latest" \
            --tag "${SPOT_WORKER_IMAGE_NAME}:${{ github.sha }}" \
            .

      - name: Build futures worker image
        run: |
          WORKER_BUILD_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          FUTURES_STRATEGY_VERSION="$(git ls-files src/TradingBot.Core src/TradingBot.FuturesWorker | sort | xargs sha256sum | sha256sum | cut -d ' ' -f1)"
          WORKER_CHANGE_SET="$(awk '/^## / {print $2; exit}' .ai/worker-changelog.md)"
          docker build \
            --file src/TradingBot.FuturesWorker/Dockerfile \
            --build-arg "TRADINGBOT_WORKER_VERSION=${{ github.sha }}" \
            --build-arg "TRADINGBOT_WORKER_COMMIT=${{ github.sha }}" \
            --build-arg "TRADINGBOT_WORKER_BUILD_UTC=${WORKER_BUILD_UTC}" \
            --build-arg "TRADINGBOT_WORKER_IMAGE_TAG=${{ github.sha }}" \
            --build-arg "TRADINGBOT_WORKER_STRATEGY_VERSION=${FUTURES_STRATEGY_VERSION}" \
            --build-arg "TRADINGBOT_WORKER_CHANGE_SET=${WORKER_CHANGE_SET}" \
            --tag "${FUTURES_WORKER_IMAGE_NAME}:latest" \
            --tag "${FUTURES_WORKER_IMAGE_NAME}:${{ github.sha }}" \
            .

      - name: Build market data worker image
        run: |
          docker build \
            --file src/TradingBot.MarketDataWorker/Dockerfile \
            --tag "${MARKET_DATA_WORKER_IMAGE_NAME}:latest" \
            --tag "${MARKET_DATA_WORKER_IMAGE_NAME}:${{ github.sha }}" \
            .

      - name: Build API image
        run: |
          docker build \
            --file src/TradingBot.Api/Dockerfile \
            --tag "${API_IMAGE_NAME}:latest" \
            --tag "${API_IMAGE_NAME}:${{ github.sha }}" \
            .

      - name: Build web image
        run: |
          docker build \
            --file src/TradingBot.Web/Dockerfile \
            --tag "${WEB_IMAGE_NAME}:latest" \
            --tag "${WEB_IMAGE_NAME}:${{ github.sha }}" \
            .

      - name: Push images
        run: |
          docker push "${UI_IMAGE_NAME}:latest"
          docker push "${UI_IMAGE_NAME}:${{ github.sha }}"
          docker push "${API_IMAGE_NAME}:latest"
          docker push "${API_IMAGE_NAME}:${{ github.sha }}"
          docker push "${WEB_IMAGE_NAME}:latest"
          docker push "${WEB_IMAGE_NAME}:${{ github.sha }}"
          docker push "${SPOT_WORKER_IMAGE_NAME}:latest"
          docker push "${SPOT_WORKER_IMAGE_NAME}:${{ github.sha }}"
          docker push "${FUTURES_WORKER_IMAGE_NAME}:latest"
          docker push "${FUTURES_WORKER_IMAGE_NAME}:${{ github.sha }}"
          docker push "${MARKET_DATA_WORKER_IMAGE_NAME}:latest"
          docker push "${MARKET_DATA_WORKER_IMAGE_NAME}:${{ github.sha }}"

      - name: Upload deploy bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          retention-days: 1
          path: |
            infra/deploy.sh
            infra/docker-compose.prod.yml
            infra/traefik/trading-bot.yml
            src/TradingBot.SpotWorker/appsettings.json
            src/TradingBot.FuturesWorker/appsettings.json
            src/TradingBot.MarketDataWorker/appsettings.json

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 10
    environment: PROD

    env:
      UI_IMAGE_NAME: ghcr.io/bykovas/trading-bot-ui
      UI_IMAGE_TAG: ${{ github.sha }}
      API_IMAGE_NAME: ghcr.io/bykovas/trading-bot-api
      API_IMAGE_TAG: ${{ github.sha }}
      WEB_IMAGE_NAME: ghcr.io/bykovas/trading-bot-web
      WEB_IMAGE_TAG: ${{ github.sha }}
      SPOT_WORKER_IMAGE_NAME: ghcr.io/bykovas/trading-bot-spot-worker
      SPOT_WORKER_IMAGE_TAG: ${{ github.sha }}
      FUTURES_WORKER_IMAGE_NAME: ghcr.io/bykovas/trading-bot-futures-worker
      FUTURES_WORKER_IMAGE_TAG: ${{ github.sha }}
      MARKET_DATA_WORKER_IMAGE_NAME: ghcr.io/bykovas/trading-bot-market-data-worker
      MARKET_DATA_WORKER_IMAGE_TAG: ${{ github.sha }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TRADINGBOT_DB_PASSWORD: ${{ secrets.TRADINGBOT_DB_PASSWORD }}
      TRADINGBOT_KRAKEN_API_KEY: ${{ secrets.TRADINGBOT_KRAKEN_API_KEY }}
      TRADINGBOT_KRAKEN_API_SECRET: ${{ secrets.TRADINGBOT_KRAKEN_API_SECRET }}
      TRADINGBOT_OPENAI_API_KEY: ${{ secrets.TRADINGBOT_OPENAI_API_KEY }}
      # Live trading is controlled from the PROD environment variable, never from
      # code: flipping it requires editing the GitHub environment, not a commit.
      TRADINGBOT_LIVE_TRADING_ENABLED: ${{ vars.TRADINGBOT_LIVE_TRADING_ENABLED }}
      TRADINGBOT_FUTURES_LIVE_TRADING_ENABLED: ${{ vars.TRADINGBOT_FUTURES_LIVE_TRADING_ENABLED }}
      TRADINGBOT_KRAKEN_FUTURES_API_KEY: ${{ secrets.TRADINGBOT_KRAKEN_FUTURES_API_KEY }}
      TRADINGBOT_KRAKEN_FUTURES_API_SECRET: ${{ secrets.TRADINGBOT_KRAKEN_FUTURES_API_SECRET }}

    steps:
      - name: Download deploy bundle
        uses: actions/download-artifact@v4
        with:
          name: deploy-bundle

      - name: Deploy
        run: bash infra/deploy.sh
