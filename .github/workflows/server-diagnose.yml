name: server-diagnose
on: { workflow_dispatch: {} }
jobs:
  why-skipped:
    runs-on: self-hosted
    steps:
      - name: BYKO - ETH/AAVE/BNB decisions, why opened or skipped (last 3h)
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select to_char(utc,'HH24:MI') as t, pair, desired_position as want, round(score::numeric,3) as score, round(long_score_threshold::numeric,3) as thr, round(spread_percent::numeric,3) as spread, coalesce(left(entry_rejection_reason,60),'-') as rejection from dry_run_decision_facts where bot_instance_id='futures-live' and pair in ('ETH/USD','AAVE/USD','BNB/USD') and utc >= now() - interval '3 hours' order by pair, utc desc limit 60"
      - name: BYKO - how many slots are actually filled right now
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select count(*) as open_positions, string_agg(pair, ', ' order by pair) as pairs from portfolio_position_state where bot_instance_id='futures-live'"
      - name: BYKO - did ETH ever get a non-flat desired in the window?
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select pair, desired_position, count(*) from dry_run_decision_facts where bot_instance_id='futures-live' and pair in ('ETH/USD','AAVE/USD') and utc >= now() - interval '3 hours' group by pair, desired_position order by pair"
