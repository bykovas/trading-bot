# One-off server diagnostics, runnable only by hand (workflow_dispatch) and only by
# someone with write access. The repo is PUBLIC: these steps print pairs, scores and
# rejection text - the class of fact the dashboard already publishes - never credentials.
name: server-diagnose

on:
  workflow_dispatch:

jobs:
  mass-close:
    runs-on: self-hosted
    steps:
      - name: The 11:01 closes in full - reason text and origin
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select a.pair, a.side, to_char(c.utc,'HH24:MI:SS') as utc, a.action, coalesce(a.exit_reason_code,'-') as code, coalesce(a.origin,'-') as origin, left(coalesce(a.reason,'-'),110) as reason from dry_run_actions a join dry_run_cycle_facts c on c.cycle_id=a.cycle_id where c.bot_instance_id='futures-live' and c.utc between '2026-08-28 10:55' and '2026-08-28 11:20' and a.action in ('WOULD_SELL','WOULD_CLOSE','WOULD_OPEN_LONG','WOULD_OPEN_SHORT') order by c.utc, a.pair"

      - name: Worker restarts and container uptime
        run: |
          docker ps --filter name=trading-bot-futures --format 'table {{.Names}}\t{{.Status}}\t{{.RunningFor}}'
          echo '--- restarts ---'
          docker inspect trading-bot-futures-worker-live --format '{{.Name}} restarts={{.RestartCount}} startedAt={{.State.StartedAt}}' || true
          docker inspect trading-bot-lukas-futures-worker-live --format '{{.Name}} restarts={{.RestartCount}} startedAt={{.State.StartedAt}}' || true

      - name: What the worker logged around 11:00-11:05
        run: |
          docker logs trading-bot-futures-worker-live --since 2026-08-28T10:55:00Z --until 2026-08-28T11:06:00Z 2>&1 | grep -iE "sync|reconcil|adopt|close|position|cash-jump|collateral|liquid|error|fail" | head -60 || true

      - name: Cash events and collateral moves today
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select to_char(utc,'HH24:MI:SS') as utc, bot_instance_id as bot, event_type, round(amount_eur::numeric,2) as amount, left(coalesce(note,'-'),80) as note from portfolio_cash_events where utc >= '2026-08-28' order by utc limit 40" || true

      - name: Were the same pairs reopened right after the mass close
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select a.pair, a.side, to_char(c.utc,'HH24:MI') as utc, a.action from dry_run_actions a join dry_run_cycle_facts c on c.cycle_id=a.cycle_id where c.bot_instance_id='futures-live' and c.utc >= '2026-08-28 10:55' and a.action in ('WOULD_OPEN_SHORT','WOULD_OPEN_LONG','WOULD_CLOSE','WOULD_SELL') and a.pair in ('SOL/USD','OP/USD','APT/USD','ARB/USD','INJ/USD','BCH/USD') order by a.pair, c.utc"
