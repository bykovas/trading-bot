name: server-diagnose
on: { workflow_dispatch: {} }
jobs:
  verify:
    runs-on: self-hosted
    steps:
      - name: trading-bot db - user-like tables and pukis
        run: |
          Q() { docker exec trading-bot-db psql -U tradingbot -d tradingbot -A -F'|' -c "$1" || true; }
          Q "select table_name from information_schema.tables where table_schema='public' and (table_name ilike '%user%' or table_name ilike '%credential%' or table_name ilike '%override%' or table_name ilike '%profile%' or table_name ilike '%account%' or table_name ilike '%login%') order by 1"
          for t in $(docker exec trading-bot-db psql -U tradingbot -d tradingbot -At -c "select table_name from information_schema.tables where table_schema='public' and (table_name ilike '%user%' or table_name ilike '%account%' or table_name ilike '%login%')"); do
            echo "--- $t (columns) ---"
            Q "select string_agg(column_name, ', ' order by ordinal_position) from information_schema.columns where table_name='$t'"
            echo "--- $t rows mentioning pukis ---"
            Q "select * from \"$t\" t where t::text ilike '%pukis%'" | sed -E 's/(\$2[aby]\$[^|]*|[A-Za-z0-9+\/=]{40,})/<redacted>/g'
          done
          echo "--- overrides / profiles per instance ---"
          Q "select bot_instance_id, override_key, numeric_value from bot_config_overrides order by 1,2"
          Q "select bot_instance_id, profile_id, profile_revision, is_active from bot_instance_strategy_profiles order by 1"
          echo "--- credentials table presence (no values) ---"
          Q "select table_name, string_agg(column_name, ', ') from information_schema.columns where table_name ilike '%credential%' group by 1"
      - name: cryptosmithx db - pukis
        run: |
          docker exec cryptosmithx-postgres psql -U marketdata -d marketdata -A -F'|' -c "select string_agg(column_name, ', ' order by ordinal_position) from information_schema.columns where table_name='webapp_user'" || true
          docker exec cryptosmithx-postgres psql -U marketdata -d marketdata -At -c "select count(*) from webapp_user where webapp_user::text ilike '%pukis%'" || true
      - name: containers
        run: docker ps --format '{{.Names}}\t{{.Status}}' | grep -i trading-bot
