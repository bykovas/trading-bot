# One-off server diagnostics, runnable only by hand (workflow_dispatch) and only by
# someone with write access. The repo is PUBLIC: these steps print pairs, timestamps,
# prices and exit reasons - the same class of fact the dashboard already publishes -
# and never echo credentials.
name: server-diagnose

on:
  workflow_dispatch:

jobs:
  stopped-out:
    runs-on: self-hosted
    steps:
      - name: What futures-live wanted today but had no slot for
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select d.pair, count(*) as cycles, min(d.utc) as first_wanted, max(d.utc) as last_wanted, max(round(d.score::numeric,2)) as best_score, mode() within group (order by d.desired_position) as side from dry_run_decision_facts d join dry_run_decision_risk_reasons r on r.cycle_id=d.cycle_id and r.decision_index=d.decision_index where d.bot_instance_id='futures-live' and r.reason ilike '%slots exhausted%' and d.utc >= '2026-08-26 00:00' group by 1 order by 2 desc limit 40"

      - name: Slot-exhaustion rejections per hour today
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select date_trunc('hour', d.utc) as hour, count(*) as blocked, count(distinct d.pair) as pairs from dry_run_decision_facts d join dry_run_decision_risk_reasons r on r.cycle_id=d.cycle_id and r.decision_index=d.decision_index where d.bot_instance_id='futures-live' and r.reason ilike '%slots exhausted%' and d.utc >= '2026-08-26 00:00' group by 1 order by 1"

      - name: Every PROFITABLE close of futures-live since 2026-08-19
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select c.utc as closed_utc, a.pair, a.side, round(a.entry_price::numeric,8) as entry, round(a.fill_price::numeric,8) as exit_px, round(a.quantity::numeric,6) as qty, coalesce(a.exit_reason_code,a.action) as reason, round((case when a.side='SHORT' then (a.entry_price-a.fill_price) else (a.fill_price-a.entry_price) end / a.entry_price * 100)::numeric,2) as pct from dry_run_actions a join dry_run_cycle_facts c on c.cycle_id=a.cycle_id where c.bot_instance_id='futures-live' and a.action in ('WOULD_SELL','WOULD_CLOSE') and a.entry_price > 0 and a.fill_price > 0 and (case when a.side='SHORT' then (a.entry_price-a.fill_price) else (a.fill_price-a.entry_price) end) > 0 and c.utc >= '2026-08-19' order by c.utc limit 200"

      - name: Which exit reasons closed positions since 2026-08-19
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select c.bot_instance_id, coalesce(a.exit_reason_code, a.action) as reason, count(*), round(sum(a.fill_price*a.quantity)::numeric,2) as gross from dry_run_actions a join dry_run_cycle_facts c on c.cycle_id=a.cycle_id where a.action in ('WOULD_SELL','WOULD_CLOSE') and c.utc >= '2026-08-19' group by 1,2 order by 1,3 desc"

      - name: Every stop-loss close of futures-live since 2026-08-19
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select c.utc as closed_utc, a.pair, a.side, round(a.entry_price::numeric,8) as entry, round(a.fill_price::numeric,8) as exit_px, round(a.quantity::numeric,6) as qty, coalesce(a.exit_reason_code,a.action) as reason from dry_run_actions a join dry_run_cycle_facts c on c.cycle_id=a.cycle_id where c.bot_instance_id='futures-live' and a.action in ('WOULD_SELL','WOULD_CLOSE') and coalesce(a.exit_reason_code,'') ilike '%STOP%' and coalesce(a.exit_reason_code,'') not ilike '%TRAIL%' and c.utc >= '2026-08-19' order by c.utc limit 200"

      - name: When each of those positions was opened
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select c.utc as opened_utc, a.pair, a.side, round(a.fill_price::numeric,8) as entry_fill, round(a.quantity::numeric,6) as qty from dry_run_actions a join dry_run_cycle_facts c on c.cycle_id=a.cycle_id where c.bot_instance_id='futures-live' and a.action in ('WOULD_BUY','WOULD_OPEN_LONG','WOULD_OPEN_SHORT') and c.utc >= '2026-08-18' order by c.utc limit 300"
