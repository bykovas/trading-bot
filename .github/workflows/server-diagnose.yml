name: server-diagnose
on: { workflow_dispatch: {} }
jobs:
  lukas-value-basis:
    runs-on: self-hosted
    steps:
      - name: LUKO - raw Kraken wallets the bot saw (marginBalance vs availableMargin)
        run: |
          docker logs --since 20m trading-bot-lukas-futures-worker-live 2>&1 \
            | grep -E "futures-kraken-wallet|futures cycle done" | tail -20 || echo "no wallet lines in window"
      - name: LUKO - what the bot booked as cash/total this cycle
        run: |
          docker logs --since 20m trading-bot-lukas-futures-worker-live 2>&1 \
            | grep -E "futures cycle done" | tail -3 || echo "no cycle line"
      - name: LUKO - open positions (used margin + unrealized)
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select pair, side, round(entry_price::numeric,5) as entry, round(initial_margin_eur::numeric,3) as used_margin, round(unrealized_pnl_eur::numeric,3) as upnl, round(mark_price::numeric,5) as mark from portfolio_position_state where bot_instance_id='futures-lukas-live' order by pair"
