name: server-diagnose
on: { workflow_dispatch: {} }
jobs:
  d-trades:
    runs-on: self-hosted
    steps:
      - name: schema of trade/action tables
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select table_name, string_agg(column_name, ', ' order by ordinal_position) cols from information_schema.columns where table_name in ('dry_run_actions','portfolio_action_history_state') group by 1"
      - name: closed trades since D execution fix (2026-08-30 10:43 UTC)
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -A -F '|' -c \
            "select * from dry_run_actions limit 0" 2>&1 | head -2
      - name: candidate close rows
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -A -F '|' -c \
            "select a.* from dry_run_actions a limit 3"
