# One-off server diagnostics, runnable only by hand (workflow_dispatch) and only by
# someone with write access. It exists because the workstation has no interactive SSH
# into the box while the deploy runner lives on it.
#
# The repo is PUBLIC, so everything echoed here is public. The steps therefore print
# only what the dashboard already publishes - transfer kinds, amounts and dates - and
# whatever they read from the worker env stays inside the runner: keys are used to SIGN
# one read-only request and are never echoed.
name: server-diagnose

on:
  workflow_dispatch:

jobs:
  cash-events:
    runs-on: self-hosted
    steps:
      - name: High-score candidates the bots refused on 2026-08-25
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select d.pair, count(*) as looks, max(round(d.score::numeric,2)) as best_score, min(d.utc) as first_seen, max(d.utc) as last_seen, mode() within group (order by d.entry_rejection_reason) as usual_reason from dry_run_decision_facts d where d.bot_instance_id='futures-lukas-live' and d.utc >= '2026-08-24 21:00' and d.utc < '2026-08-25 21:00' and d.score >= 0.8 and d.desired_position='FLAT' group by d.pair order by looks desc limit 25"

      - name: What the bots ever wanted but did not open on 2026-08-25
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select d.bot_instance_id, d.pair, d.desired_position, count(*) as cycles, min(d.utc) as first_seen, mode() within group (order by d.entry_rejection_reason) as usual_reason from dry_run_decision_facts d where d.utc >= '2026-08-24 21:00' and d.utc < '2026-08-25 21:00' and d.desired_position <> 'FLAT' group by 1,2,3 order by cycles desc limit 30"
