# One-off server diagnostics, runnable only by hand (workflow_dispatch) and only by
# someone with write access. It exists because the workstation has no interactive SSH
# into the box while the deploy runner lives on it.
#
# The repo is PUBLIC, so everything echoed here is public. The steps therefore print
# only what the dashboard already publishes - transfer kinds, amounts and dates - and
# whatever they read from the worker env stays inside the runner: keys are used to SIGN
# one read-only request and are never echoed.
name: server-diagnose

on:
  workflow_dispatch:

jobs:
  cash-events:
    runs-on: self-hosted
    steps:
      - name: Every closed trade since the experiment started
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select d.bot_instance_id, d.utc, d.pair, d.desired_position, a.exit_reason_code, round(a.net_notional_eur::numeric,2) as pnl, left(coalesce(a.reason,''),90) as reason from dry_run_decision_facts d join dry_run_actions a on a.cycle_id=d.cycle_id and a.pair=d.pair where a.action='WOULD_CLOSE' and d.utc >= '2026-08-24 18:25' order by d.utc"

      - name: Entries since the experiment started, with channel
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select d.bot_instance_id, d.utc, d.pair, a.action, a.entry_channel, round(d.score::numeric,2) as score from dry_run_decision_facts d join dry_run_actions a on a.cycle_id=d.cycle_id and a.pair=d.pair where a.action like 'WOULD_OPEN%' and d.utc >= '2026-08-24 18:25' order by d.utc"
