name: server-diagnose
on: { workflow_dispatch: {} }
jobs:
  verify:
    runs-on: self-hosted
    steps:
      - name: cycle facts columns
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -A -F '|' -c \
            "select string_agg(column_name,', ') from information_schema.columns where table_name='dry_run_cycle_facts'"
      - name: equity boundaries
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -A -F '|' -c \
            "select bot_instance_id, count(*) from dry_run_cycle_facts f join dry_run_cycles c using (cycle_id) where c.utc >= now() - interval '2 days' group by 1"
      - name: reject codes today
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -A -F '|' -c \
            "select f.bot_instance_id, string_agg(distinct r.reason, ' ~ ') from dry_run_decision_risk_reasons r join dry_run_decision_facts f using (cycle_id, decision_index) where f.utc >= now() - interval '3 hours' group by 1"
