# One-off server diagnostics, runnable only by hand (workflow_dispatch) and only by
# someone with write access. The repo is PUBLIC: these steps print pairs, scores and
# rejection text - the class of fact the dashboard already publishes - never credentials.
name: server-diagnose

on:
  workflow_dispatch:

jobs:
  todays-shorts:
    runs-on: self-hosted
    steps:
      - name: Every SHORT that closed today, both bots, with how it ended
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select c.bot_instance_id as bot, a.pair, coalesce(a.strategy,'Momentum') as book, to_char(c.utc,'HH24:MI') as closed, round(a.entry_price::numeric,5) as entry, round(a.fill_price::numeric,5) as exit_px, round(((a.entry_price-a.fill_price)/a.entry_price*100)::numeric,2) as pnl_pct, coalesce(a.exit_reason_code,'-') as why from dry_run_actions a join dry_run_cycle_facts c on c.cycle_id=a.cycle_id where a.side='SHORT' and a.action in ('WOULD_SELL','WOULD_CLOSE') and a.entry_price>0 and a.fill_price>0 and c.utc >= '2026-08-28' order by c.utc"

      - name: Today by bot, side and book - is it only the shorts
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select c.bot_instance_id as bot, a.side, coalesce(a.strategy,'Momentum') as book, count(*) as trades, count(*) filter (where (case when a.side='SHORT' then a.entry_price-a.fill_price else a.fill_price-a.entry_price end) > 0) as winners, round(avg(case when a.side='SHORT' then (a.entry_price-a.fill_price)/a.entry_price*100 else (a.fill_price-a.entry_price)/a.entry_price*100 end)::numeric,3) as avg_pct from dry_run_actions a join dry_run_cycle_facts c on c.cycle_id=a.cycle_id where a.action in ('WOULD_SELL','WOULD_CLOSE') and a.entry_price>0 and a.fill_price>0 and c.utc >= '2026-08-28' group by 1,2,3 order by 1,2,3"

      - name: THE BUG TEST - what the price did AFTER each short entry today
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "with op as (select c.bot_instance_id as bot, a.pair, c.utc as opened, a.entry_price, coalesce(a.strategy,'Momentum') as book from dry_run_actions a join dry_run_cycle_facts c on c.cycle_id=a.cycle_id where a.side='SHORT' and a.action='WOULD_OPEN_SHORT' and c.utc >= '2026-08-28') select op.bot, op.pair, op.book, to_char(op.opened,'HH24:MI') as opened, round(op.entry_price::numeric,5) as entry, round(((p1.close-op.entry_price)/op.entry_price*100)::numeric,2) as px_1h, round(((p3.close-op.entry_price)/op.entry_price*100)::numeric,2) as px_3h, round(((p6.close-op.entry_price)/op.entry_price*100)::numeric,2) as px_6h from op left join lateral (select close from market_candles where pair=op.pair and timeframe_minutes=15 and open_time >= op.opened + interval '1 hour' order by open_time limit 1) p1 on true left join lateral (select close from market_candles where pair=op.pair and timeframe_minutes=15 and open_time >= op.opened + interval '3 hours' order by open_time limit 1) p3 on true left join lateral (select close from market_candles where pair=op.pair and timeframe_minutes=15 and open_time >= op.opened + interval '6 hours' order by open_time limit 1) p6 on true order by op.opened"

      - name: Same test for the LONGS opened today - is the whole book wrong or only shorts
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "with op as (select c.bot_instance_id as bot, a.pair, c.utc as opened, a.entry_price, coalesce(a.strategy,'Momentum') as book from dry_run_actions a join dry_run_cycle_facts c on c.cycle_id=a.cycle_id where a.side='LONG' and a.action='WOULD_OPEN_LONG' and c.utc >= '2026-08-28') select op.bot, op.pair, op.book, to_char(op.opened,'HH24:MI') as opened, round(((p1.close-op.entry_price)/op.entry_price*100)::numeric,2) as px_1h, round(((p3.close-op.entry_price)/op.entry_price*100)::numeric,2) as px_3h, round(((p6.close-op.entry_price)/op.entry_price*100)::numeric,2) as px_6h from op left join lateral (select close from market_candles where pair=op.pair and timeframe_minutes=15 and open_time >= op.opened + interval '1 hour' order by open_time limit 1) p1 on true left join lateral (select close from market_candles where pair=op.pair and timeframe_minutes=15 and open_time >= op.opened + interval '3 hours' order by open_time limit 1) p3 on true left join lateral (select close from market_candles where pair=op.pair and timeframe_minutes=15 and open_time >= op.opened + interval '6 hours' order by open_time limit 1) p6 on true order by op.opened"

      - name: What the market itself did today - BTC and the breadth
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "with btc as (select open_time + interval '15 minutes' as ts, close, close/nullif(lag(close,96) over (order by open_time),0)*100-100 as btc24h, close/nullif(lag(close,4) over (order by open_time),0)*100-100 as btc1h from market_candles where pair='XBT/USD' and timeframe_minutes=15) select to_char(ts,'HH24:MI') as utc, round(close::numeric,0) as btc, round(btc24h::numeric,2) as h24, round(btc1h::numeric,2) as h1 from btc where ts >= '2026-08-28' and extract(hour from ts) in (0,3,6,9,12,15,18) and extract(minute from ts)=0 order by ts"

      - name: Has the Reversal book fired at all since it deployed
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select coalesce(a.strategy,'(null=Momentum)') as book, a.action, a.side, count(*) as n, min(to_char(c.utc,'HH24:MI')) as first_seen from dry_run_actions a join dry_run_cycle_facts c on c.cycle_id=a.cycle_id where c.bot_instance_id='futures-live' and c.utc >= '2026-08-28 10:00' and a.action like 'WOULD_%' and a.side is not null group by 1,2,3 order by 1,2,3"
