name: server-diagnose
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: self-hosted
    steps:
      - name: open positions now
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -A -F '|' -c \
            "select pair, side, round(entry_price::numeric,6) entry, round(mark_price::numeric,6) mark, round(unrealized_pnl_eur::numeric,2) upnl, round(stop_distance_pct::numeric,3) stop_pct, coalesce(trailing_stop_state,'-') trail, to_char(opened_at_utc,'HH24:MI') opened from portfolio_position_state where bot_instance_id='futures-live' order by opened_at_utc"
      - name: fills since 07:30 UTC
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -A -F '|' -c \
            "select to_char(c.utc,'HH24:MI:SS') t, a.pair, a.side, coalesce(a.exit_reason_code,'OPEN') code, round(a.entry_price::numeric,6) entry, round(a.fill_price::numeric,6) fill, round(a.stop_distance_pct::numeric,3) stop_pct from dry_run_actions a join dry_run_cycles c on c.cycle_id=a.cycle_id where c.bot_instance_id='futures-live' and c.utc >= '2026-09-01 07:30' and a.fill_source is not null and a.fill_source<>'' order by c.utc"
      - name: equity last 5h
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -A -F '|' -c \
            "select to_char(date_trunc('hour',utc),'HH24:MI') h, round((array_agg(portfolio_value_after_eur order by utc desc))[1]::numeric,2) eq from dry_run_cycle_facts where bot_instance_id='futures-live' and utc >= now()-interval '5 hours' group by 1 order by 1"
