name: server-diagnose
on: { workflow_dispatch: {} }
jobs:
  luko-equity:
    runs-on: self-hosted
    steps:
      - name: LUKO daily equity (last portfolio value per day) + cycles
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -A -F ',' -c \
            "select date(utc) d, round((array_agg(portfolio_value_after_eur order by utc desc))[1]::numeric,2) eq from dry_run_cycle_facts where bot_instance_id='futures-lukas-live' group by date(utc) order by d"
      - name: LUKO cash events (deposits/withdrawals that move equity without trading)
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -A -F ',' -c \
            "select date(occurred_at_utc) d, round(sum(amount_eur)::numeric,2) cash_move from portfolio_cash_events where bot_instance_id='futures-lukas-live' group by date(occurred_at_utc) order by d" 2>&1 | head -40 || echo "no cash_events table/cols"
