name: server-diagnose
on: { workflow_dispatch: {} }
jobs:
  market-morning:
    runs-on: self-hosted
    steps:
      - name: BTC price seen by the bot, hourly this morning
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select to_char(date_trunc('hour',utc),'HH24:MI') h, round((array_agg(price order by utc desc))[1]::numeric,0) btc from dry_run_decision_facts where bot_instance_id='futures-live' and pair in ('XBT/USD','BTC/USD') and utc >= now() - interval '9 hours' group by 1 order by 1"
      - name: closes today with reasons (action history)
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select to_char(utc,'HH24:MI') t, pair, left(coalesce(reason,''),70) reason from portfolio_action_history_state where bot_instance_id='futures-live' and utc >= now() - interval '7 hours' and (action like '%CLOSE%' or reason ilike '%stop%' or reason ilike '%uzdar%' or action like '%SELL%') order by utc desc limit 20" 2>&1 | head -30 || true
