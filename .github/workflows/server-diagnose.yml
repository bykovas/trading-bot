name: server-diagnose
on: { workflow_dispatch: {} }
jobs:
  spread-dist:
    runs-on: self-hosted
    steps:
      - name: futures-live spread_percent distribution (for maker-fill model)
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select count(*) n, round(avg(spread_percent)::numeric,4) mean, round((percentile_cont(0.25) within group (order by spread_percent))::numeric,4) p25, round((percentile_cont(0.5) within group (order by spread_percent))::numeric,4) median, round((percentile_cont(0.75) within group (order by spread_percent))::numeric,4) p75, round((percentile_cont(0.9) within group (order by spread_percent))::numeric,4) p90 from dry_run_decision_facts where bot_instance_id='futures-live' and spread_percent is not null and spread_percent>0 and desired_position in ('LONG','SHORT')"
      - name: spread by side
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select desired_position, count(*) n, round(avg(spread_percent)::numeric,4) mean, round((percentile_cont(0.5) within group (order by spread_percent))::numeric,4) median from dry_run_decision_facts where bot_instance_id='futures-live' and spread_percent is not null and spread_percent>0 and desired_position in ('LONG','SHORT') group by desired_position"
