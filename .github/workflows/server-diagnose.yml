# One-off server diagnostics, runnable only by hand (workflow_dispatch) and only by
# someone with write access. The repo is PUBLIC: these steps print pairs, scores and
# rejection text - the class of fact the dashboard already publishes - never credentials.
name: server-diagnose

on:
  workflow_dispatch:

jobs:
  shorts-vs-btc:
    runs-on: self-hosted
    steps:
      - name: What action and side values exist since the experiment began
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select c.bot_instance_id, a.action, coalesce(a.side,'-') as side, count(*) from dry_run_actions a join dry_run_cycle_facts c on c.cycle_id=a.cycle_id where c.utc >= '2026-08-24' and c.bot_instance_id in ('futures-live','futures-lukas-live') group by 1,2,3 order by 1,2,3"

      - name: How often BYKO refused a short because BTC was up, by day
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select date_trunc('day', d.utc)::date as day, count(*) as refusals, count(distinct d.pair) as pairs from dry_run_decision_facts d join dry_run_decision_risk_reasons r on r.cycle_id=d.cycle_id and r.decision_index=d.decision_index where d.bot_instance_id='futures-live' and d.utc >= '2026-08-24' and r.reason like '%EXPERIMENT_SHORT_BTC_RISING%' group by 1 order by 1"

      - name: The pairs BYKO refused that way, and what LUKO did with them
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "with refused as (select distinct d.pair, date_trunc('hour', d.utc) as hr from dry_run_decision_facts d join dry_run_decision_risk_reasons r on r.cycle_id=d.cycle_id and r.decision_index=d.decision_index where d.bot_instance_id='futures-live' and d.utc >= '2026-08-24' and r.reason like '%EXPERIMENT_SHORT_BTC_RISING%'), luko as (select d.pair, date_trunc('hour', d.utc) as hr, bool_or(d.risk_approved and d.desired_position='SHORT') as luko_shorted from dry_run_decision_facts d where d.bot_instance_id='futures-lukas-live' and d.utc >= '2026-08-24' group by 1,2) select count(*) as refused_pair_hours, count(*) filter (where l.luko_shorted) as luko_took_it from refused f left join luko l on l.pair=f.pair and l.hr=f.hr"

      - name: Every closed SHORT since 2026-08-24, both bots, with the BTC state at entry
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "with btc as (select open_time + interval '15 minutes' as ts, close, close/nullif(lag(close,96) over (order by open_time),0)*100-100 as btc24h, close/nullif(lag(close,32) over (order by open_time),0)*100-100 as btc8h from market_candles where pair='XBT/USD' and timeframe_minutes=15), sh as (select c.bot_instance_id as bot, c.utc as closed, a.pair, a.entry_price, a.fill_price, (a.entry_price-a.fill_price)/a.entry_price*100 as pnl_pct from dry_run_actions a join dry_run_cycle_facts c on c.cycle_id=a.cycle_id where a.action in ('WOULD_SELL','WOULD_CLOSE') and a.side='SHORT' and a.entry_price>0 and a.fill_price>0 and c.bot_instance_id in ('futures-live','futures-lukas-live') and c.utc >= '2026-08-24') select s.bot, s.pair, to_char(s.closed,'MM-DD HH24:MI') as closed, round(s.pnl_pct::numeric,2) as pnl_pct, round(b.btc24h::numeric,2) as btc24h_at_close, round(b.btc8h::numeric,2) as btc8h_at_close from sh s left join lateral (select * from btc where btc.ts <= s.closed order by btc.ts desc limit 1) b on true order by s.bot, s.closed"

      - name: Shorts bucketed by the BTC state, both bots
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "with btc as (select open_time + interval '15 minutes' as ts, close/nullif(lag(close,96) over (order by open_time),0)*100-100 as btc24h, close/nullif(lag(close,32) over (order by open_time),0)*100-100 as btc8h from market_candles where pair='XBT/USD' and timeframe_minutes=15), sh as (select c.bot_instance_id as bot, c.utc as closed, (a.entry_price-a.fill_price)/a.entry_price*100 as pnl_pct from dry_run_actions a join dry_run_cycle_facts c on c.cycle_id=a.cycle_id where a.action in ('WOULD_SELL','WOULD_CLOSE') and a.side='SHORT' and a.entry_price>0 and a.fill_price>0 and c.bot_instance_id in ('futures-live','futures-lukas-live') and c.utc >= '2026-08-24') select s.bot, case when b.btc24h <= 0 then 'BTC 24h down' when b.btc8h > 0 then 'BTC 24h up, 8h still up' else 'BTC 24h up, 8h flat or down' end as regime, count(*) as trades, count(*) filter (where s.pnl_pct > 0) as winners, round(avg(s.pnl_pct)::numeric,3) as avg_pct, round(sum(s.pnl_pct)::numeric,2) as sum_pct from sh s left join lateral (select * from btc where btc.ts <= s.closed order by btc.ts desc limit 1) b on true group by 1,2 order by 1,2"

      - name: BTC 24h and 8h over the last five days, every four hours
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "with btc as (select open_time + interval '15 minutes' as ts, close, close/nullif(lag(close,96) over (order by open_time),0)*100-100 as btc24h, close/nullif(lag(close,32) over (order by open_time),0)*100-100 as btc8h from market_candles where pair='XBT/USD' and timeframe_minutes=15) select to_char(ts,'MM-DD HH24:MI') as utc, round(close::numeric,0) as btc, round(btc24h::numeric,2) as h24, round(btc8h::numeric,2) as h8, case when btc24h > 0 and btc8h > 0 then 'shorts banned, would stay banned' when btc24h > 0 then 'shorts banned, would be ALLOWED' else 'shorts allowed already' end as effect from btc where ts >= now() - interval '5 days' and extract(hour from ts) in (0,4,8,12,16,20) and extract(minute from ts) = 0 order by ts"
