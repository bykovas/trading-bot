# One-off server diagnostics, runnable only by hand (workflow_dispatch) and only by
# someone with write access. The repo is PUBLIC: these steps print pairs, scores and
# rejection text - the class of fact the dashboard already publishes - never credentials.
name: server-diagnose

on:
  workflow_dispatch:

jobs:
  chain-recon:
    runs-on: self-hosted
    steps:
      - name: How far back the decision trail actually goes
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select 'decision_facts' as t, min(utc)::date as from_day, max(utc)::date as to_day, count(*) as rows from dry_run_decision_facts union all select 'risk_reasons', min(c.utc)::date, max(c.utc)::date, count(*) from dry_run_decision_risk_reasons r join dry_run_cycle_facts c on c.cycle_id=r.cycle_id union all select 'actions', min(c.utc)::date, max(c.utc)::date, count(*) from dry_run_actions a join dry_run_cycle_facts c on c.cycle_id=a.cycle_id union all select 'market_candles 15m', min(open_time)::date, max(open_time)::date, count(*) from market_candles where timeframe_minutes=15 union all select 'market_candles 1m', min(open_time)::date, max(open_time)::date, count(*) from market_candles where timeframe_minutes=1"

      - name: Actual entries per bot per side over the last 45 days
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select c.bot_instance_id as bot, a.action, count(*) as n, min(c.utc)::date as first_day, max(c.utc)::date as last_day, count(distinct c.utc::date) as days from dry_run_actions a join dry_run_cycle_facts c on c.cycle_id=a.cycle_id where c.utc >= now() - interval '45 days' and a.action like 'WOULD_OPEN%' group by 1,2 order by 1,2"

      - name: Every refusal reason over the last 45 days, both bots, by frequency
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select c.bot_instance_id as bot, substring(r.reason from '^[^:(]*') as reason_kind, count(*) as times, count(distinct d.pair) as pairs, count(distinct c.utc::date) as days from dry_run_decision_facts d join dry_run_cycle_facts c on c.cycle_id=d.cycle_id join dry_run_decision_risk_reasons r on r.cycle_id=d.cycle_id and r.decision_index=d.decision_index and r.reason_index=0 where c.utc >= now() - interval '45 days' group by 1,2 having count(*) > 200 order by 1, 3 desc"

      - name: How many distinct pairs the scan list carried, and candle coverage per pair
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select count(distinct pair) as pairs_15m, count(*) as rows_15m, min(open_time)::date as from_day from market_candles where timeframe_minutes=15 and open_time >= now() - interval '46 days'"

      - name: Do we store the per-cycle ticker snapshots, and for how long
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select min(utc)::date as from_day, max(utc)::date as to_day, count(*) as rows, count(distinct pair) as pairs from market_snapshots"
