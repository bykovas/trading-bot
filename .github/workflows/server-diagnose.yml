name: server-diagnose
on: { workflow_dispatch: {} }
jobs:
  replay-coverage:
    runs-on: self-hosted
    steps:
      - name: market_candles coverage over the window
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select timeframe_minutes tf, min(open_time) min_t, max(open_time) max_t, count(distinct date(open_time)) days, count(distinct pair) pairs, count(*) rows from market_candles group by 1 order by 1"
      - name: market_candles inside 2026-07-08..2026-08-21 (15m)
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select count(*) rows, count(distinct pair) pairs, count(distinct date(open_time)) days, min(open_time) min_t, max(open_time) max_t from market_candles where timeframe_minutes=15 and open_time >= '2026-07-08' and open_time < '2026-08-22'"
      - name: market_snapshots (quote time series) coverage
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select min(utc) min_t, max(utc) max_t, count(distinct date(utc)) days, count(distinct pair) pairs, count(*) rows from market_snapshots where bot_instance_id='futures-live'"
      - name: market_snapshots cadence + coverage inside window
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select count(*) rows, count(distinct date(utc)) days, count(distinct pair) pairs, min(utc) min_t, max(utc) max_t from market_snapshots where bot_instance_id='futures-live' and utc >= '2026-07-08' and utc < '2026-08-22'"
      - name: are quotes/orderbooks latest-only or time series (row counts)
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select 'market_quotes' t, count(*) rows, count(distinct pair) pairs from market_quotes union all select 'market_orderbooks', count(*), count(distinct pair) from market_orderbooks"
      - name: decision facts history span (current-config decisions)
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select min(utc) min_t, max(utc) max_t, count(distinct date(utc)) days from dry_run_decision_facts where bot_instance_id='futures-live'"
