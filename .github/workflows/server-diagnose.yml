name: server-diagnose
on: { workflow_dispatch: {} }
jobs:
  live-entries:
    runs-on: self-hosted
    steps:
      - name: distinct fresh LONG entries on 2026-08-30 (transitions not->LONG per pair)
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "with s as (select pair, utc, desired_position, lag(desired_position) over (partition by pair order by utc) prev from dry_run_decision_facts where bot_instance_id='futures-live' and date(utc)='2026-08-30') select count(*) fresh_long_entries from s where desired_position='LONG' and (prev is distinct from 'LONG')"
      - name: same but only rows that actually filled (FillSource REAL if present)
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select column_name from information_schema.columns where table_name='dry_run_decision_facts' and column_name in ('fill_source','action','filled','fill_known','average_fill_price')" 2>&1 | head
      - name: opens per day from action history (if table has open events)
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select date(utc) d, count(*) n from portfolio_action_history_state where bot_instance_id='futures-live' and action ilike '%OPEN%' and utc >= '2026-08-29' group by 1 order by 1" 2>&1 | head || true
      - name: distinct LONG-entry pairs 08-30 with times (sample)
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "with s as (select pair, utc, desired_position, lag(desired_position) over (partition by pair order by utc) prev from dry_run_decision_facts where bot_instance_id='futures-live' and date(utc)='2026-08-30') select to_char(utc,'HH24:MI') t, pair from s where desired_position='LONG' and (prev is distinct from 'LONG') order by utc limit 40"
