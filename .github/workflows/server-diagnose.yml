name: server-diagnose
on: { workflow_dispatch: {} }
jobs:
  trail-log:
    runs-on: self-hosted
    steps:
      - name: Every trailing-arm / spread / rollback log line for DOGE and HBAR today
        run: |
          docker logs trading-bot-futures-worker-live 2>&1 | grep -iE "PF_DOGEUSD|PF_HBARUSD" | grep -iE "trailing-arm|trailing-spread|trailing-rollback|external-trailing|maxhold-trail" | tail -60 || echo "no trail log lines"
      - name: Worker restarts today
        run: |
          docker inspect trading-bot-futures-worker-live --format 'startedAt={{.State.StartedAt}} restarts={{.RestartCount}}'
          echo "--- container created/started history in log (bootstrap lines) ---"
          docker logs trading-bot-futures-worker-live 2>&1 | grep -iE "starting|bootstrap|hydrat|worker started|BlynAI|version" | tail -15 || true
      - name: How HBAR closed
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select to_char(c.utc,'HH24:MI:SS') as utc, a.action, round(a.entry_price::numeric,5) as entry, round(a.fill_price::numeric,5) as fill, round((case when a.entry_price>0 then (a.entry_price-a.fill_price)/a.entry_price*100 else 0 end)::numeric,2) as pnl_pct, coalesce(a.exit_reason_code,'-') as code from dry_run_actions a join dry_run_cycle_facts c on c.cycle_id=a.cycle_id where a.pair='HBAR/USD' and c.bot_instance_id='futures-live' and c.utc >= '2026-08-29 09:00' and a.action in ('WOULD_OPEN_SHORT','WOULD_CLOSE','WOULD_SELL') order by c.utc"
      - name: DOGE decision facts around each arm - did trailing reset
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select bot_instance_id, pair, round(entry_price::numeric,5) as entry, round(peak_pnl_percent::numeric,2) as peak, to_char(peak_pnl_at_utc,'HH24:MI:SS') as peak_at, to_char(trailing_activated_at_utc,'HH24:MI:SS') as armed_at, to_char(updated_at,'HH24:MI:SS') as updated from portfolio_position_state where pair='DOGE/USD' and bot_instance_id='futures-live'"
