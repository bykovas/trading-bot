name: server-diagnose
on: { workflow_dispatch: {} }
jobs:
  regime-d-live-positions:
    runs-on: self-hosted
    steps:
      - name: futures-live open positions - is the stop the ATR stop and is the TP gone?
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select pair, side, to_char(opened_at_utc,'HH24:MI') as opened, round(entry_price::numeric,5) as entry, round(stop_distance_pct::numeric,3) as stop_pct, round(stop_loss_price::numeric,5) as sl_price, take_profit_price as tp_price, round(atr_pct::numeric,3) as atr_pct, coalesce(trailing_stop_state,'-') as trail, coalesce(tp_order_state,'-') as tp_state from portfolio_position_state where bot_instance_id='futures-live' order by pair"
