name: server-diagnose
on: { workflow_dispatch: {} }
jobs:
  blocked-shorts-now:
    runs-on: self-hosted
    steps:
      - name: short signals >= threshold blocked since shorts-off deploy (05:25 UTC)
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select count(*) blocked_signals, count(distinct pair) pairs, to_char(max(utc),'HH24:MI') latest from dry_run_decision_facts where bot_instance_id='futures-live' and utc >= '2026-08-31 05:25' and short_score is not null and short_score >= coalesce(short_score_threshold,0.8) and desired_position='FLAT'"
      - name: distinct short episodes (pair x hour) and top pairs
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select pair, count(*) n, round(max(short_score)::numeric,2) best from dry_run_decision_facts where bot_instance_id='futures-live' and utc >= '2026-08-31 05:25' and short_score is not null and short_score >= coalesce(short_score_threshold,0.8) and desired_position='FLAT' group by pair order by n desc limit 10"
      - name: shorts actually open now (must be 0)
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select count(*) shorts_open from portfolio_position_state where bot_instance_id='futures-live' and side='SHORT'"
