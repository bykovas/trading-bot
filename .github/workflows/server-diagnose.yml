name: server-diagnose
on: { workflow_dispatch: {} }
jobs:
  why-skipped-2:
    runs-on: self-hosted
    steps:
      - name: BYKO - ETH score vs threshold (why FLAT)
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select to_char(utc,'HH24:MI') as t, round(score::numeric,3) as score, round(long_score_threshold::numeric,3) as thr, round(coalesce(short_score,0)::numeric,3) as sh, round(spread_percent::numeric,3) as spread, coalesce(left(entry_rejection_reason,55),'-') as rejection from dry_run_decision_facts where bot_instance_id='futures-live' and pair='ETH/USD' and utc >= now() - interval '3 hours' order by utc desc limit 25"
      - name: BYKO - open positions right now (slot usage)
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select pair, side, round(initial_margin_eur::numeric,2) as margin, to_char(opened_at_utc,'HH24:MI') as opened from portfolio_position_state where bot_instance_id='futures-live' order by opened_at_utc"
      - name: BYKO - AAVE full risk-reason detail at a rejected cycle
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select to_char(f.utc,'HH24:MI') as t, r.reason_index as i, left(r.reason,90) as reason from dry_run_decision_facts f join dry_run_decision_risk_reasons r on r.cycle_id=f.cycle_id and r.decision_index=f.decision_index where f.bot_instance_id='futures-live' and f.pair='AAVE/USD' and f.utc >= now() - interval '90 minutes' order by f.utc desc, r.reason_index limit 15"
