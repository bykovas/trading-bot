# One-off server diagnostics, runnable only by hand (workflow_dispatch) and only by
# someone with write access. The repo is PUBLIC: these steps print pairs, scores and
# rejection text - the class of fact the dashboard already publishes - never credentials.
name: server-diagnose

on:
  workflow_dispatch:

jobs:
  entry-delay:
    runs-on: self-hosted
    steps:
      - name: For every real entry, the earliest moment the signal was already there
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "with e as (select c.cycle_id, c.utc as entry_utc, a.pair, a.action, a.entry_price from dry_run_actions a join dry_run_cycle_facts c on c.cycle_id=a.cycle_id where c.bot_instance_id='futures-live' and a.action in ('WOULD_OPEN_LONG','WOULD_OPEN_SHORT') and c.utc >= '2026-07-27'), f as (select e.*, (select d.utc from dry_run_decision_facts d join dry_run_cycle_facts cc on cc.cycle_id=d.cycle_id where cc.bot_instance_id='futures-live' and d.pair=e.pair and d.utc < e.entry_utc and d.utc > e.entry_utc - interval '8 hours' and ((e.action='WOULD_OPEN_LONG' and d.score >= 0.8) or (e.action='WOULD_OPEN_SHORT' and d.short_score >= 0.8)) order by d.utc limit 1) as first_ready from e) select f.action, count(*) as entries, count(f.first_ready) as had_earlier_signal, round(avg(extract(epoch from (f.entry_utc-f.first_ready))/60)::numeric,1) as avg_delay_min, round((percentile_cont(0.5) within group (order by extract(epoch from (f.entry_utc-f.first_ready))/60))::numeric,1) as median_delay_min, round(max(extract(epoch from (f.entry_utc-f.first_ready))/60)::numeric,1) as max_delay_min from f group by 1"

      - name: What was blocking at that earliest ready moment, and what the delay cost
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "with e as (select c.cycle_id, c.utc as entry_utc, a.pair, a.action, a.entry_price from dry_run_actions a join dry_run_cycle_facts c on c.cycle_id=a.cycle_id where c.bot_instance_id='futures-live' and a.action in ('WOULD_OPEN_LONG','WOULD_OPEN_SHORT') and c.utc >= '2026-07-27'), f as (select e.*, r.first_utc, r.first_price, r.reason from e left join lateral (select d.utc as first_utc, d.price as first_price, rr.reason from dry_run_decision_facts d join dry_run_cycle_facts cc on cc.cycle_id=d.cycle_id left join dry_run_decision_risk_reasons rr on rr.cycle_id=d.cycle_id and rr.decision_index=d.decision_index and rr.reason_index=0 where cc.bot_instance_id='futures-live' and d.pair=e.pair and d.utc < e.entry_utc and d.utc > e.entry_utc - interval '8 hours' and ((e.action='WOULD_OPEN_LONG' and d.score >= 0.8) or (e.action='WOULD_OPEN_SHORT' and d.short_score >= 0.8)) order by d.utc limit 1) r on true) select f.action, substring(f.reason from '^[^:(]*') as blocked_by, count(*) as trades, round((percentile_cont(0.5) within group (order by extract(epoch from (f.entry_utc-f.first_utc))/60))::numeric,0) as med_delay_min, round((percentile_cont(0.5) within group (order by case when f.action='WOULD_OPEN_LONG' then (f.entry_price-f.first_price)/f.first_price*100 else (f.first_price-f.entry_price)/f.first_price*100 end))::numeric,3) as med_price_cost_pct from f where f.first_utc is not null group by 1,2 order by 1, 3 desc"

      - name: Did the delay pay for itself - result of delayed versus prompt entries
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "with e as (select c.cycle_id, c.utc as entry_utc, a.pair, a.action, a.entry_price from dry_run_actions a join dry_run_cycle_facts c on c.cycle_id=a.cycle_id where c.bot_instance_id='futures-live' and a.action in ('WOULD_OPEN_LONG','WOULD_OPEN_SHORT') and c.utc >= '2026-07-27'), f as (select e.*, (select d.utc from dry_run_decision_facts d join dry_run_cycle_facts cc on cc.cycle_id=d.cycle_id where cc.bot_instance_id='futures-live' and d.pair=e.pair and d.utc < e.entry_utc and d.utc > e.entry_utc - interval '8 hours' and ((e.action='WOULD_OPEN_LONG' and d.score >= 0.8) or (e.action='WOULD_OPEN_SHORT' and d.short_score >= 0.8)) order by d.utc limit 1) as first_ready from e), x as (select f.*, cl.pnl_pct from f left join lateral (select case when f.action='WOULD_OPEN_SHORT' then (a2.entry_price-a2.fill_price)/a2.entry_price*100 else (a2.fill_price-a2.entry_price)/a2.entry_price*100 end as pnl_pct from dry_run_actions a2 join dry_run_cycle_facts c2 on c2.cycle_id=a2.cycle_id where c2.bot_instance_id='futures-live' and a2.pair=f.pair and a2.action in ('WOULD_SELL','WOULD_CLOSE') and a2.entry_price>0 and a2.fill_price>0 and c2.utc > f.entry_utc order by c2.utc limit 1) cl on true) select action, case when first_ready is null then 'entered on the first ready cycle' when extract(epoch from (entry_utc-first_ready))/60 < 15 then 'delayed under 15 min' when extract(epoch from (entry_utc-first_ready))/60 < 60 then 'delayed 15-60 min' else 'delayed over an hour' end as bucket, count(*) as trades, count(pnl_pct) as closed, round(avg(pnl_pct)::numeric,3) as avg_pnl_pct, round((percentile_cont(0.5) within group (order by pnl_pct))::numeric,3) as med_pnl_pct from x group by 1,2 order by 1,2"

      - name: Candidate moments that never became a trade at all, by what stopped them
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select case when d.score >= 0.8 then 'LONG ready' else 'SHORT ready' end as side, substring(r.reason from '^[^:(]*') as stopped_by, count(*) as cycles, count(distinct d.pair) as pairs, count(distinct (d.pair, date_trunc('hour', d.utc))) as pair_hours from dry_run_decision_facts d join dry_run_cycle_facts c on c.cycle_id=d.cycle_id join dry_run_decision_risk_reasons r on r.cycle_id=d.cycle_id and r.decision_index=d.decision_index and r.reason_index=0 where c.bot_instance_id='futures-live' and c.utc >= '2026-07-27' and (d.score >= 0.8 or d.short_score >= 0.8) and d.desired_position = 'FLAT' group by 1,2 having count(*) > 50 order by 1, 3 desc limit 30"
