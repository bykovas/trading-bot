name: server-diagnose
on: { workflow_dispatch: {} }
jobs:
  short-desires-when:
    runs-on: self-hosted
    steps:
      - name: timestamps of SHORT desires after 05:25 (are they pre-restart tail?)
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select to_char(min(utc),'HH24:MI:SS') first, to_char(max(utc),'HH24:MI:SS') last, count(*) n from dry_run_decision_facts where bot_instance_id='futures-live' and utc >= '2026-08-31 05:25' and desired_position='SHORT'"
      - name: worker restart time (container start)
        run: |
          docker inspect trading-bot-futures-worker-live --format 'started {{.State.StartedAt}}'
