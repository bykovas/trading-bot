# One-off server diagnostics, runnable only by hand (workflow_dispatch) and only by
# someone with write access. The repo is PUBLIC: these steps print pairs, scores and
# rejection text - the class of fact the dashboard already publishes - never credentials.
name: server-diagnose

on:
  workflow_dispatch:

jobs:
  late-longs:
    runs-on: self-hosted
    steps:
      - name: XMR - every decision BYKO made on it today
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select to_char(d.utc,'HH24:MI') as utc, round(d.price::numeric,3) as price, round(d.score::numeric,2) as score, round(d.rsi::numeric,1) as rsi, round(d.bullish_ema_gap_percent::numeric,3) as gap, d.desired_position as want, d.risk_approved as ok, left(coalesce(r.reason,'-'),88) as reason from dry_run_decision_facts d left join dry_run_decision_risk_reasons r on r.cycle_id=d.cycle_id and r.decision_index=d.decision_index and r.reason_index=0 where d.bot_instance_id='futures-live' and d.pair='XMR/USD' and d.utc >= '2026-08-28 00:00' order by d.utc"

      - name: MSTRX - every decision BYKO made on it today
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select to_char(d.utc,'HH24:MI') as utc, round(d.price::numeric,3) as price, round(d.score::numeric,2) as score, d.desired_position as want, d.risk_approved as ok, left(coalesce(r.reason,'-'),88) as reason from dry_run_decision_facts d left join dry_run_decision_risk_reasons r on r.cycle_id=d.cycle_id and r.decision_index=d.decision_index and r.reason_index=0 where d.bot_instance_id='futures-live' and d.pair='MSTRX/USD' and d.utc >= '2026-08-28 00:00' and d.utc <= '2026-08-28 01:00' order by d.utc"

      - name: How the price of both pairs moved before the entry
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select pair, to_char(open_time,'MM-DD HH24:MI') as bar, round(open::numeric,3) as o, round(high::numeric,3) as h, round(low::numeric,3) as l, round(close::numeric,3) as c from market_candles where pair in ('XMR/USD','MSTRX/USD') and timeframe_minutes=15 and open_time >= '2026-08-27 18:00' order by pair, open_time"

      - name: What LUKO decided on the same two pairs today
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select d.pair, to_char(d.utc,'HH24:MI') as utc, round(d.score::numeric,2) as score, d.desired_position as want, d.risk_approved as ok, left(coalesce(r.reason,'-'),80) as reason from dry_run_decision_facts d left join dry_run_decision_risk_reasons r on r.cycle_id=d.cycle_id and r.decision_index=d.decision_index and r.reason_index=0 where d.bot_instance_id='futures-lukas-live' and d.pair in ('XMR/USD','MSTRX/USD') and d.utc >= '2026-08-28 00:00' order by d.pair, d.utc"

      - name: Everything BYKO refused today, grouped by reason
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select left(r.reason,70) as reason, count(*) as times, count(distinct d.pair) as pairs from dry_run_decision_facts d join dry_run_decision_risk_reasons r on r.cycle_id=d.cycle_id and r.decision_index=d.decision_index and r.reason_index=0 where d.bot_instance_id='futures-live' and d.utc >= '2026-08-28 00:00' and d.desired_position <> 'FLAT' group by 1 order by 2 desc limit 25"
