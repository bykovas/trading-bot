name: server-diagnose
on: { workflow_dispatch: {} }
jobs:
  live-funnel:
    runs-on: self-hosted
    steps:
      - name: cycle cadence + candidate volume per day (futures-live, last 3 days)
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select date(utc) d, count(distinct cycle_id) cycles, count(*) candidate_rows, count(distinct pair) pairs, round(count(*)::numeric/nullif(count(distinct cycle_id),0),1) cand_per_cycle from dry_run_decision_facts where bot_instance_id='futures-live' and utc >= '2026-08-29' group by 1 order by 1"
      - name: 2026-08-30 funnel by desired_position
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select desired_position, count(*) n from dry_run_decision_facts where bot_instance_id='futures-live' and date(utc)='2026-08-30' group by 1 order by 2 desc"
      - name: 2026-08-30 reject-reason histogram (the funnel stages)
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select coalesce(entry_rejection_reason,'(entered/none)') reason, count(*) n from dry_run_decision_facts where bot_instance_id='futures-live' and date(utc)='2026-08-30' group by 1 order by 2 desc limit 25"
      - name: 2026-08-30 actual opens that day
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select count(*) opens from portfolio_position_state where bot_instance_id='futures-live' and date(opened_at_utc)='2026-08-30'" 2>&1 || true
