# One-off server diagnostics, runnable only by hand (workflow_dispatch) and only by
# someone with write access. The repo is PUBLIC: these steps print pairs, scores and
# rejection text - the class of fact the dashboard already publishes - never credentials.
name: server-diagnose

on:
  workflow_dispatch:

jobs:
  why-idle:
    runs-on: self-hosted
    steps:
      - name: Wanted-but-blocked vs never-wanted, futures-live, last 3 hours
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select d.risk_approved, count(*) as decisions, count(distinct d.pair) as pairs, count(distinct d.cycle_id) as cycles from dry_run_decision_facts d where d.bot_instance_id='futures-live' and d.utc >= now() - interval '3 hours' group by 1"

      - name: The FIRST detailed reason, grouped, last 3 hours
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select d.risk_approved, left(r.reason, 105) as first_reason, count(*) from dry_run_decision_facts d join dry_run_decision_risk_reasons r on r.cycle_id=d.cycle_id and r.decision_index=d.decision_index and r.reason_index=0 where d.bot_instance_id='futures-live' and d.utc >= now() - interval '3 hours' group by 1,2 order by 3 desc limit 30"

      - name: Any slot-exhaustion at all, last 12 hours
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select date_trunc('hour', d.utc) as hour, count(*) as slot_blocked from dry_run_decision_facts d join dry_run_decision_risk_reasons r on r.cycle_id=d.cycle_id and r.decision_index=d.decision_index where d.bot_instance_id='futures-live' and r.reason ilike '%slots exhausted%' and d.utc >= now() - interval '12 hours' group by 1 order by 1 desc limit 12"

      - name: How close the short side is getting to its threshold
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select width_bucket(d.short_score, 0, 1, 10) as bucket, round(min(d.short_score)::numeric,2) as from_score, round(max(d.short_score)::numeric,2) as to_score, count(*) from dry_run_decision_facts d where d.bot_instance_id='futures-live' and d.utc >= now() - interval '3 hours' and d.has_bearish_structure group by 1 order by 1 desc limit 12"

      - name: Opens and closes today
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -c \
            "select date_trunc('hour', c.utc) as hour, count(*) filter (where a.action in ('WOULD_BUY','WOULD_OPEN_LONG','WOULD_OPEN_SHORT')) as opened, count(*) filter (where a.action in ('WOULD_SELL','WOULD_CLOSE')) as closed from dry_run_actions a join dry_run_cycle_facts c on c.cycle_id=a.cycle_id where c.bot_instance_id='futures-live' and c.utc >= now() - interval '14 hours' group by 1 order by 1 desc limit 14"
