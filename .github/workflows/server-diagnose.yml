name: server-diagnose
on: { workflow_dispatch: {} }
jobs:
  verify:
    runs-on: self-hosted
    steps:
      - name: equity today both
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -A -F '|' -c \
            "select f.bot_instance_id, date_trunc('hour', c.utc) h, max(f.portfolio_value_after_eur) v from dry_run_cycle_facts f join dry_run_cycles c using (cycle_id) where c.utc >= date_trunc('day', now() at time zone 'utc') - interval '4 hours' and f.bot_instance_id in ('futures-live','futures-lukas-live') group by 1,2 order by 1,2"
      - name: equity now
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -A -F '|' -c \
            "select distinct on (f.bot_instance_id) f.bot_instance_id, c.utc, f.cash_after_eur, f.positions_value_after_eur, f.portfolio_value_after_eur from dry_run_cycle_facts f join dry_run_cycles c using (cycle_id) where f.bot_instance_id in ('futures-live','futures-lukas-live') order by f.bot_instance_id, c.utc desc"
