name: server-diagnose
on: { workflow_dispatch: {} }
jobs:
  luko-same-window:
    runs-on: self-hosted
    steps:
      - name: LUKO all closes same window
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -A -F '|' -c \
            "select to_char(c.utc,'MM-DD HH24:MI:SS') t, a.pair, a.side, a.exit_reason_code code, round(a.entry_price::numeric,8) entry, round(a.fill_price::numeric,8) fill, round(coalesce(a.filled_notional_eur,150)::numeric,2) notional from dry_run_actions a join dry_run_cycles c on c.cycle_id=a.cycle_id where c.bot_instance_id='futures-lukas-live' and c.utc >= '2026-08-30 10:43' and a.exit_reason_code is not null and a.exit_reason_code<>'' order by c.utc"
      - name: LUKO close-code histogram
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -A -F '|' -c \
            "select a.exit_reason_code, a.side, count(*) from dry_run_actions a join dry_run_cycles c on c.cycle_id=a.cycle_id where c.bot_instance_id='futures-lukas-live' and c.utc >= '2026-08-30 10:43' and a.exit_reason_code is not null and a.exit_reason_code<>'' group by 1,2 order by 3 desc"
