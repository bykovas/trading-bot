name: server-diagnose
on: { workflow_dispatch: {} }
jobs:
  d-audit:
    runs-on: self-hosted
    steps:
      - name: ALL real fills since D execution fix (2026-08-30 10:43 UTC)
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -A -F '|' -c \
            "select to_char(c.utc,'MM-DD HH24:MI:SS') t, a.pair, a.side, a.action, coalesce(a.exit_reason_code,'-') exitcode, a.reduce_only, round(a.entry_price::numeric,6) entry, round(a.fill_price::numeric,6) fill, round(a.quantity::numeric,4) qty, round(a.filled_notional_eur::numeric,2) notional, round(a.fee_eur::numeric,4) fee, round(a.atr_pct::numeric,4) atr, round(a.stop_distance_pct::numeric,4) stop_pct, round(a.take_profit_distance_pct::numeric,4) tp_pct, round((a.portfolio_value_after_eur-a.portfolio_value_before_eur)::numeric,4) dpv, coalesce(a.strategy,'-') strat, coalesce(a.fill_source,'-') src from dry_run_actions a join dry_run_cycles c on c.cycle_id=a.cycle_id where c.bot_instance_id='futures-live' and c.utc >= '2026-08-30 10:43' and a.fill_source is not null and a.fill_source <> '' order by c.utc"
      - name: exit reason histogram since D
        run: |
          docker exec trading-bot-db psql -U tradingbot -d tradingbot -A -F '|' -c \
            "select coalesce(a.exit_reason_code,'(open)') code, a.side, count(*) n, round(sum(a.portfolio_value_after_eur-a.portfolio_value_before_eur)::numeric,2) dpv_sum from dry_run_actions a join dry_run_cycles c on c.cycle_id=a.cycle_id where c.bot_instance_id='futures-live' and c.utc >= '2026-08-30 10:43' and a.fill_source is not null and a.fill_source<>'' group by 1,2 order by 3 desc"
