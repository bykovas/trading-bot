# Deployed by infra/deploy.sh to /opt/traefik/dynamic/trading-bot.yml on every
# release: edit this file, never the copy on the server.
#
# Three hosts serve the same stack. fin.bykovas.lt is the original entry point;
# algo.meetluko.eu and algo.bykovas.lt are the per-tester dashboards named in the
# page's own disclaimer. They differ only in which account the page opens on,
# which the page decides from the hostname — the routing below is identical, so
# /api stays same-origin on every host.
http:
  routers:
    trading-bot-http:
      rule: "Host(`fin.bykovas.lt`, `algo.meetluko.eu`, `algo.bykovas.lt`)"
      entryPoints:
        - web
      middlewares:
        - trading-bot-https-redirect
      service: trading-bot

    trading-bot-https:
      rule: "Host(`fin.bykovas.lt`, `algo.meetluko.eu`, `algo.bykovas.lt`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: trading-bot

    trading-bot-web-https:
      rule: "Host(`fin.bykovas.lt`, `algo.meetluko.eu`, `algo.bykovas.lt`) && PathPrefix(`/web`)"
      entryPoints:
        - websecure
      priority: 1100
      tls:
        certResolver: letsencrypt
      service: trading-bot-web

    trading-bot-api-https:
      rule: "Host(`fin.bykovas.lt`, `algo.meetluko.eu`, `algo.bykovas.lt`) && PathPrefix(`/api`)"
      entryPoints:
        - websecure
      priority: 1000
      tls:
        certResolver: letsencrypt
      service: trading-bot-api

  middlewares:
    trading-bot-https-redirect:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    trading-bot:
      loadBalancer:
        servers:
          - url: "http://trading-bot-ui:80"

    trading-bot-api:
      loadBalancer:
        servers:
          - url: "http://trading-bot-api:8080"

    trading-bot-web:
      loadBalancer:
        servers:
          - url: "http://trading-bot-web:8080"
