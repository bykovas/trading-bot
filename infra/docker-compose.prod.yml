services:
  trading-bot:
    container_name: trading-bot
    image: ${IMAGE_NAME}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - traefik

  worker:
    container_name: trading-bot-worker
    image: ${WORKER_IMAGE_NAME}:${WORKER_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      TRADINGBOT_MARKET_DATA_MODE: ${TRADINGBOT_MARKET_DATA_MODE:-kraken}
      TRADINGBOT_RUN_ONCE: "false"
      TRADINGBOT_LOOP_INTERVAL_SECONDS: ${TRADINGBOT_LOOP_INTERVAL_SECONDS:-300}
      # Optional AI watchlist advisor (leave unset to stay on the heuristic).
      # TRADINGBOT_AI_PROVIDER, TRADINGBOT_AI_BASE_URL, TRADINGBOT_AI_MODEL, TRADINGBOT_AI_API_KEY
      # are picked up from the host environment / /opt/trading-bot/.env if defined.
      TRADINGBOT_AI_PROVIDER: ${TRADINGBOT_AI_PROVIDER:-none}
      TRADINGBOT_AI_BASE_URL: ${TRADINGBOT_AI_BASE_URL:-}
      TRADINGBOT_AI_MODEL: ${TRADINGBOT_AI_MODEL:-}
      TRADINGBOT_AI_API_KEY: ${TRADINGBOT_AI_API_KEY:-}
    volumes:
      - /opt/trading-bot/appsettings.json:/app/appsettings.json:ro
      - /opt/trading-bot/data:/app/data

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
