services:
  ui:
    container_name: trading-bot-ui
    image: ${UI_IMAGE_NAME}:${UI_IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - traefik

  worker:
    container_name: trading-bot-worker
    image: ${WORKER_IMAGE_NAME}:${WORKER_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - /opt/trading-bot/.env
    depends_on:
      database:
        condition: service_healthy
    # Runtime config is mounted from the host, but deploy overwrites this file
    # from src/TradingBot.Worker/appsettings.json on every release.
    # Secret values come from /opt/trading-bot/.env, generated by CI/CD.
    volumes:
      - /opt/trading-bot/appsettings.json:/app/appsettings.json:ro
      - /opt/trading-bot/data:/app/data
      - /opt/trading-bot/logs:/app/logs

  database:
    container_name: trading-bot-db
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - /opt/trading-bot/.env
    environment:
      POSTGRES_DB: tradingbot
      POSTGRES_USER: tradingbot
    # Expose Postgres only on the VPN interface, not on public interfaces.
    ports:
      - "10.8.0.1:5432:5432"
    volumes:
      - /opt/trading-bot/database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradingbot -d tradingbot"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
