services:
  ui:
    container_name: trading-bot-ui
    image: ${UI_IMAGE_NAME}:${UI_IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - traefik


  web:
    container_name: trading-bot-web
    image: ${WEB_IMAGE_NAME}:${WEB_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_PATHBASE: /web
    env_file:
      - /opt/trading-bot/web/.env
    depends_on:
      db-ready:
        condition: service_completed_successfully
    networks:
      - default
      - traefik

  api:
    container_name: trading-bot-api
    image: ${API_IMAGE_NAME}:${API_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - /opt/trading-bot/api/.env
    depends_on:
      db-ready:
        condition: service_completed_successfully
    networks:
      - default
      - traefik

  spot-worker-live:
    container_name: trading-bot-spot-worker-live
    image: ${SPOT_WORKER_IMAGE_NAME}:${SPOT_WORKER_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - /opt/trading-bot/spot/live/.env
    depends_on:
      db-ready:
        condition: service_completed_successfully
    # Runtime config, secrets, data, and logs are instance-specific.
    volumes:
      - /opt/trading-bot/spot/live/appsettings.json:/app/appsettings.json:ro
      - /opt/trading-bot/spot/live/data:/app/data
      - /opt/trading-bot/spot/live/logs:/app/logs

  spot-worker-virtual:
    container_name: trading-bot-spot-worker-virtual
    image: ${SPOT_WORKER_IMAGE_NAME}:${SPOT_WORKER_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - /opt/trading-bot/spot/virtual/.env
    depends_on:
      db-ready:
        condition: service_completed_successfully
    # Virtual worker is forced non-live by /opt/trading-bot/spot/virtual/.env.
    volumes:
      - /opt/trading-bot/spot/virtual/appsettings.json:/app/appsettings.json:ro
      - /opt/trading-bot/spot/virtual/data:/app/data
      - /opt/trading-bot/spot/virtual/logs:/app/logs

  futures-worker-live:
    container_name: trading-bot-futures-worker-live
    image: ${FUTURES_WORKER_IMAGE_NAME}:${FUTURES_WORKER_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - /opt/trading-bot/futures/live/.env
    depends_on:
      db-ready:
        condition: service_completed_successfully
    # Futures live execution is gated by /opt/trading-bot/futures/live/.env.
    volumes:
      - /opt/trading-bot/futures/live/appsettings.json:/app/appsettings.json:ro
      - /opt/trading-bot/futures/live/data:/app/data
      - /opt/trading-bot/futures/live/logs:/app/logs

  futures-worker-lukas-live:
    container_name: trading-bot-lukas-futures-worker-live
    image: ${FUTURES_WORKER_IMAGE_NAME}:${FUTURES_WORKER_IMAGE_TAG:-latest}
    restart: unless-stopped
    profiles:
      - lukas-live
    env_file:
      - /opt/trading-bot/futures/lukas-live/.env
    depends_on:
      db-ready:
        condition: service_completed_successfully
    # Lukas uses an isolated account, runtime config, state, and exchange orders.
    volumes:
      - /opt/trading-bot/futures/lukas-live/appsettings.json:/app/appsettings.json:ro
      - /opt/trading-bot/futures/lukas-live/data:/app/data
      - /opt/trading-bot/futures/lukas-live/logs:/app/logs

  futures-worker-virtual:
    container_name: trading-bot-futures-worker-virtual
    image: ${FUTURES_WORKER_IMAGE_NAME}:${FUTURES_WORKER_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - /opt/trading-bot/futures/virtual/.env
    depends_on:
      db-ready:
        condition: service_completed_successfully
    volumes:
      - /opt/trading-bot/futures/virtual/appsettings.json:/app/appsettings.json:ro
      - /opt/trading-bot/futures/virtual/data:/app/data
      - /opt/trading-bot/futures/virtual/logs:/app/logs

  market-data-worker:
    container_name: trading-bot-market-data-worker
    image: ${MARKET_DATA_WORKER_IMAGE_NAME}:${MARKET_DATA_WORKER_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - /opt/trading-bot/market-data/.env
    depends_on:
      db-ready:
        condition: service_completed_successfully
    volumes:
      - /opt/trading-bot/market-data/appsettings.json:/app/appsettings.json:ro
      - /opt/trading-bot/market-data/logs:/app/logs

  database:
    container_name: trading-bot-db
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - /opt/trading-bot/postgres/.env
    environment:
      POSTGRES_DB: tradingbot
      POSTGRES_USER: tradingbot
    # Expose Postgres only on a non-public interface. The default localhost bind
    # keeps database startup independent from late VPN interface creation; set
    # POSTGRES_BIND_HOST=10.8.0.1 only on hosts that guarantee wg0 is up first.
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:5432:5432"
    volumes:
      - /opt/trading-bot/database:/var/lib/postgresql/data

  db-ready:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      database:
        condition: service_started
    command: ["sh", "-c", "until pg_isready -h database -p 5432 -U tradingbot -d tradingbot; do sleep 2; done"]
    networks:
      - default

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
