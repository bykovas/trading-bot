services:
  trading-bot:
    container_name: trading-bot
    image: ${IMAGE_NAME}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - traefik

  worker:
    container_name: trading-bot-worker
    image: ${WORKER_IMAGE_NAME}:${WORKER_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Single source of truth for ALL worker config — Kraken/AI API keys, LiveTradingEnabled,
    # market data mode, loop interval, risk and strategy — is the mounted appsettings.json.
    # Edit /opt/trading-bot/appsettings.json on the host and restart the container.
    # No config is injected via environment variables here.
    volumes:
      - /opt/trading-bot/appsettings.json:/app/appsettings.json:ro
      - /opt/trading-bot/data:/app/data

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
