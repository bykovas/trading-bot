<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blynai Capital - Cycles</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --line: rgba(246, 218, 160, 0.13);
      --ink: #f6efe1;
      --soft: #c8bba6;
      --muted: #81786b;
      --gold: #f5b84f;
      --green: #41eda0;
      --red: #ff5367;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(120deg, rgba(5, 5, 5, 0.98), rgba(14, 15, 12, 0.96) 52%, rgba(4, 15, 12, 0.94)),
        radial-gradient(circle at 12% 8%, rgba(245, 184, 79, 0.11), transparent 32%),
        var(--bg);
    }

    main {
      width: min(1360px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-end;
      padding: 14px 0 22px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 50px);
      line-height: 1;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    a, button {
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(17, 18, 15, .72);
      color: var(--gold);
      font: inherit;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      color: var(--muted);
      opacity: .7;
    }

    .panel {
      margin-top: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.012)), rgba(17,18,15,.9);
      overflow: hidden;
      box-shadow: 0 22px 60px rgba(0,0,0,.28);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      color: var(--soft);
      font-size: 13px;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(246, 218, 160, .08);
      text-align: left;
      white-space: nowrap;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      background: rgba(0,0,0,.12);
    }

    td {
      color: var(--soft);
      font-size: 13px;
    }

    .num {
      text-align: right;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    .good { color: var(--green); }
    .bad { color: var(--red); }
    .empty { padding: 28px 18px; text-align: center; color: var(--muted); }

    @media (max-width: 720px) {
      header { align-items: flex-start; flex-direction: column; }
      .actions { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Cycles</h1>
        <div class="subtitle">Raw dry-run cycles, newest first</div>
      </div>
      <nav class="actions">
        <a href="/dash.html">Portfolio</a>
        <a href="/market-snapshots.html">Market snapshots</a>
        <a href="/api/export/cycles-and-snapshots.csv">Export CSV</a>
      </nav>
    </header>

    <section class="panel">
      <div class="panel-head">
        <span id="status">Loading cycles</span>
        <span class="actions">
          <button id="prev">Prev</button>
          <button id="next">Next</button>
        </span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>UTC</th>
              <th>Cycle</th>
              <th>Mode</th>
              <th>AI</th>
              <th class="num">Pairs</th>
              <th class="num">Decisions</th>
              <th class="num">Before</th>
              <th class="num">After</th>
              <th>Raw</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td class="empty" colspan="9">Loading</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const limit = 50;
    let offset = 0;
    let nextOffset = null;

    const rows = document.getElementById("rows");
    const statusEl = document.getElementById("status");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");

    const money = new Intl.NumberFormat("en-IE", { style: "currency", currency: "EUR" });

    function text(value) {
      return value === null || value === undefined || value === "" ? "-" : String(value);
    }

    function valueClass(before, after) {
      if (!Number.isFinite(before) || !Number.isFinite(after) || before === after) return "";
      return after > before ? "good" : "bad";
    }

    function render(data) {
      nextOffset = data.nextOffset;
      statusEl.textContent = `Showing ${data.items.length} cycles · offset ${data.offset}`;
      prev.disabled = offset === 0;
      next.disabled = nextOffset === null;

      if (data.items.length === 0) {
        rows.innerHTML = '<tr><td class="empty" colspan="9">No cycles</td></tr>';
        return;
      }

      rows.innerHTML = data.items.map(item => {
        const record = item.record || {};
        const before = Number(record.portfolioBefore?.totalValueEur);
        const after = Number(record.portfolioAfter?.totalValueEur);
        return `
          <tr>
            <td class="mono">${new Date(item.utc).toLocaleString()}</td>
            <td class="mono">${item.cycleId}</td>
            <td>${text(record.marketDataMode)}</td>
            <td>${text(record.aiProvider)}</td>
            <td class="num">${record.activePairs?.length ?? 0}</td>
            <td class="num">${record.decisions?.length ?? 0}</td>
            <td class="num">${Number.isFinite(before) ? money.format(before) : "-"}</td>
            <td class="num ${valueClass(before, after)}">${Number.isFinite(after) ? money.format(after) : "-"}</td>
            <td><a href="/api/cycles/${encodeURIComponent(item.cycleId)}">JSON</a></td>
          </tr>
        `;
      }).join("");
    }

    async function load() {
      statusEl.textContent = "Loading cycles";
      const response = await fetch(`/api/cycles?limit=${limit}&offset=${offset}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      render(await response.json());
    }

    prev.addEventListener("click", () => {
      offset = Math.max(0, offset - limit);
      load().catch(error => statusEl.textContent = error.message);
    });

    next.addEventListener("click", () => {
      if (nextOffset === null) return;
      offset = nextOffset;
      load().catch(error => statusEl.textContent = error.message);
    });

    load().catch(error => statusEl.textContent = error.message);
  </script>
</body>
</html>
