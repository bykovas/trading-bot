<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlynAI Capital - Cycles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --font-display: "Space Grotesk", "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      --font-body: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
      --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
      --lh-body: 1.5;
      --bg: #050505;
      --line: rgba(246, 218, 160, 0.13);
      --ink: #f6efe1;
      --soft: #c8bba6;
      --muted: #81786b;
      --gold: #f5b84f;
      --gold-soft: #ffd987;
      --cream: #f7e6c1;
      --green: #41eda0;
      --red: #ff5367;
      --purple: #b9a6f5;
      --purple-dim: #9c8ae0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--ink);
      font-size: 14px;
      line-height: var(--lh-body);
      -webkit-font-smoothing: antialiased;
      background:
        linear-gradient(120deg, rgba(5, 5, 5, 0.98), rgba(14, 15, 12, 0.96) 52%, rgba(4, 15, 12, 0.94)),
        radial-gradient(circle at 12% 8%, rgba(245, 184, 79, 0.11), transparent 32%),
        var(--bg);
    }

    main {
      width: min(1360px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-end;
      padding: 14px 0 22px;
      border-bottom: 1px solid var(--line);
    }

    .brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: inherit;
      text-decoration: none;
    }

    .bc-mark {
      position: relative;
      width: 40px;
      height: 40px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(246, 218, 160, 0.24);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 0 22px rgba(245, 184, 79, 0.18);
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-copy .n {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 0.01em;
      line-height: 1.05;
      color: var(--cream);
      text-shadow: 0 0 34px rgba(245, 184, 79, 0.14);
      white-space: nowrap;
    }

    .brand-copy .n .ai {
      color: #F5B84F;
    }

    .brand-copy .s {
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #9B87F5;
      white-space: nowrap;
    }

    .brand-lockup .n,
    .brand-lockup .s {
      transition: color 220ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .brand-lockup:hover .n {
      color: var(--gold-soft);
    }

    .brand-lockup:hover .n .ai {
      color: var(--gold);
    }

    .brand-lockup:hover .s {
      color: var(--purple);
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(17, 18, 15, .82);
      color: var(--soft);
      font-family: var(--font-mono);
      font-size: 13px;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 14px rgba(111, 174, 255, .5);
    }

    .dot.ok {
      background: var(--green);
      box-shadow: 0 0 14px rgba(65, 237, 160, .5);
    }

    .dot.bad {
      background: var(--red);
      box-shadow: 0 0 14px rgba(255, 83, 103, .5);
    }

    .dot.warn {
      background: var(--gold);
      box-shadow: 0 0 14px rgba(245, 184, 79, .5);
    }

    a, button {
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(17, 18, 15, .72);
      color: var(--gold);
      font-family: var(--font-mono);
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
    }

    .bot-switch {
      display: inline-grid;
      grid-template-columns: repeat(4, minmax(64px, 1fr));
      align-items: center;
      gap: 3px;
      min-height: 34px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(17, 18, 15, .82);
    }

    .bot-switch button {
      min-height: 26px;
      padding: 0 10px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
    }

    .bot-switch button.active {
      background: rgba(245, 184, 79, .16);
      color: var(--gold-soft);
      box-shadow: inset 0 0 0 1px rgba(245, 184, 79, .28);
    }

    .scope-switch {
      grid-template-columns: repeat(2, minmax(116px, 1fr));
    }

    button:disabled {
      cursor: not-allowed;
      color: var(--muted);
      opacity: .7;
    }

    .panel {
      margin-top: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.012)), rgba(17,18,15,.9);
      overflow: hidden;
      box-shadow: 0 22px 60px rgba(0,0,0,.28);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      color: var(--soft);
      font-size: 13px;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(246, 218, 160, .08);
      text-align: left;
      white-space: nowrap;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      background: rgba(0,0,0,.12);
    }

    td {
      color: var(--soft);
      font-size: 13px;
    }

    .num {
      text-align: right;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .good { color: var(--green); }
    .bad { color: var(--red); }
    .empty { padding: 28px 18px; text-align: center; color: var(--muted); }

    @media (max-width: 720px) {
      header { align-items: flex-start; flex-direction: column; }
      .actions { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <a class="brand-lockup" href="/dash.html" aria-label="BlynAI Capital">
        <span class="bc-mark">
          <svg width="30" height="30" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <defs>
              <linearGradient id="bcMark" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#FFD987"/>
                <stop offset="1" stop-color="#F5B84F"/>
              </linearGradient>
            </defs>
            <path d="M16.5 9 L8.5 20 L16.5 31" stroke="url(#bcMark)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M23.5 9 L31.5 20 L23.5 31" stroke="url(#bcMark)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <circle cx="17" cy="17.5" r="2.1" fill="#FFD987"/>
            <circle cx="23" cy="17.5" r="2.1" fill="#C8963B"/>
            <circle cx="17" cy="22.5" r="2.1" fill="#C8963B"/>
            <circle cx="23" cy="22.5" r="2.1" fill="#FFD987"/>
          </svg>
        </span>
        <span class="brand-copy">
          <span class="n">Blyn<span class="ai">AI</span> Capital</span>
          <span class="s">BYKOVAS-FINANCE LAB</span>
        </span>
      </a>
      <div class="status">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">Loading status</span>
      </div>
      <nav class="actions">
        <a href="/dash.html">Portfolio</a>
        <a href="/market-snapshots.html">Market snapshots</a>
        <a href="/api/export/cycles-and-snapshots.csv">Export CSV</a>
        <div class="bot-switch" role="group" aria-label="Bot instance">
          <button type="button" data-bot-instance="spot-live">Spot Live</button>
          <button type="button" data-bot-instance="spot-virtual">Spot Virt</button>
          <button type="button" data-bot-instance="futures-live">Fut Live</button>
          <button type="button" data-bot-instance="futures-virtual">Fut Virt</button>
        </div>
        <div class="bot-switch scope-switch" role="group" aria-label="History scope">
          <button type="button" data-history-scope="current">Current strategy</button>
          <button type="button" data-history-scope="all">All history</button>
        </div>
      </nav>
    </header>

    <section class="panel">
      <div class="panel-head">
        <span id="status">Loading cycles</span>
        <span class="actions">
          <button id="prev">Prev</button>
          <button id="next">Next</button>
        </span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>LT</th>
              <th>Cycle</th>
              <th>Mode</th>
              <th>AI</th>
              <th class="num">Pairs</th>
              <th class="num">Decisions</th>
              <th class="num">Before</th>
              <th class="num">After</th>
              <th>Raw</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td class="empty" colspan="9">Loading</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/bot-status.js"></script>
  <script>
    const botButtons = Array.from(document.querySelectorAll("[data-bot-instance]"));
    const scopeButtons = Array.from(document.querySelectorAll("[data-history-scope]"));
    let currentBotInstance = "spot-live";
    let currentHistoryScope = "current";
    // Back-compat: pre-rename ids persisted in localStorage or shared URLs.
    const botInstances = ["spot-live", "spot-virtual", "futures-live", "futures-virtual"];
    function normalizeBotInstance(value) {
      if (value === "live") return "spot-live";
      if (value === "virtual") return "spot-virtual";
      return botInstances.includes(value) ? value : "spot-live";
    }
    function selectedBotParam() {
      const value = currentBotInstance || "";
      return value ? `&botInstanceId=${encodeURIComponent(value)}` : "";
    }
    function latestMetaParam() {
      return currentHistoryScope === "current" ? "&latestMeta=true" : "&latestMeta=false";
    }
    function setBotInstance(value, persist = false) {
      currentBotInstance = normalizeBotInstance(value);
      botButtons.forEach(button => {
        const active = button.dataset.botInstance === currentBotInstance;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", active ? "true" : "false");
      });
      if (persist) localStorage.setItem("tradingBot.botInstanceId", currentBotInstance);
    }
    function initBotSelector() {
      const fromUrl = new URLSearchParams(location.search).get("botInstanceId");
      const saved = localStorage.getItem("tradingBot.botInstanceId");
      setBotInstance(fromUrl || saved || "spot-live");
      botButtons.forEach(button => button.addEventListener("click", () => {
        setBotInstance(button.dataset.botInstance, true);
        offset = 0;
        refreshBotStatus();
        load().catch(error => statusEl.textContent = error.message);
      }));
    }
    function setHistoryScope(value, persist = false) {
      currentHistoryScope = value === "all" ? "all" : "current";
      scopeButtons.forEach(button => {
        const active = button.dataset.historyScope === currentHistoryScope;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", active ? "true" : "false");
      });
      if (persist) localStorage.setItem("tradingBot.historyScope", currentHistoryScope);
    }
    function initHistoryScopeSelector() {
      const fromUrl = new URLSearchParams(location.search).get("historyScope");
      const saved = localStorage.getItem("tradingBot.historyScope");
      setHistoryScope(fromUrl || saved || "current");
      scopeButtons.forEach(button => button.addEventListener("click", () => {
        setHistoryScope(button.dataset.historyScope, true);
        offset = 0;
        load().catch(error => statusEl.textContent = error.message);
      }));
    }
    const limit = 50;
    let offset = 0;
    let nextOffset = null;

    const rows = document.getElementById("rows");
    const statusEl = document.getElementById("status");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");

    const money = new Intl.NumberFormat("en-IE", { style: "currency", currency: "EUR" });

    function refreshBotStatus() {
      if (!window.BlynaiBotStatus) return;
      window.BlynaiBotStatus
        .updateBadge({ botInstanceId: currentBotInstance })
        .catch(() => {
          document.getElementById("status-dot").className = "dot bad";
          document.getElementById("status-text").textContent = "API unavailable";
        });
    }

    function text(value) {
      return value === null || value === undefined || value === "" ? "-" : String(value);
    }

    function valueClass(before, after) {
      if (!Number.isFinite(before) || !Number.isFinite(after) || before === after) return "";
      return after > before ? "good" : "bad";
    }

    function ltDateTime(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "-";
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/Vilnius",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23"
      }).formatToParts(date);
      const byType = Object.fromEntries(parts.map(part => [part.type, part.value]));
      return `${byType.year}-${byType.month}-${byType.day} ${byType.hour}:${byType.minute}:${byType.second}`;
    }

    function render(data) {
      nextOffset = data.nextOffset;
      const scopeLabel = currentHistoryScope === "current" ? "current strategy" : "all history";
      statusEl.textContent = `Showing ${data.items.length} cycles · ${scopeLabel} · offset ${data.offset}`;
      prev.disabled = offset === 0;
      next.disabled = nextOffset === null;

      if (data.items.length === 0) {
        rows.innerHTML = '<tr><td class="empty" colspan="9">No cycles</td></tr>';
        return;
      }

      rows.innerHTML = data.items.map(item => {
        const record = item.record || {};
        const before = Number(record.portfolioBefore?.totalValueEur);
        const after = Number(record.portfolioAfter?.totalValueEur);
        return `
          <tr>
            <td class="mono">${ltDateTime(item.utc)}</td>
            <td class="mono">${item.cycleId}</td>
            <td>${text(record.marketDataMode)}</td>
            <td>${text(record.aiProvider)}</td>
            <td class="num">${record.activePairs?.length ?? 0}</td>
            <td class="num">${record.decisions?.length ?? 0}</td>
            <td class="num">${Number.isFinite(before) ? money.format(before) : "-"}</td>
            <td class="num ${valueClass(before, after)}">${Number.isFinite(after) ? money.format(after) : "-"}</td>
            <td><a href="/api/cycles/${encodeURIComponent(item.cycleId)}">JSON</a></td>
          </tr>
        `;
      }).join("");
    }

    async function load() {
      statusEl.textContent = "Loading cycles";
      const response = await fetch(`/api/cycles?limit=${limit}&offset=${offset}${selectedBotParam()}${latestMetaParam()}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      render(await response.json());
    }

    prev.addEventListener("click", () => {
      offset = Math.max(0, offset - limit);
      load().catch(error => statusEl.textContent = error.message);
    });

    next.addEventListener("click", () => {
      if (nextOffset === null) return;
      offset = nextOffset;
      load().catch(error => statusEl.textContent = error.message);
    });

    initBotSelector();
    initHistoryScopeSelector();
    refreshBotStatus();
    load().catch(error => statusEl.textContent = error.message);
  </script>
</body>
</html>
