<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlynAI Capital — Cycle Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    /* ===== Design tokens (Blynai Capital) ===== */
    :root {
      --bg-void: #050505;
      --bg-1: #0B0C0A;
      --surface-panel: rgba(17, 18, 15, 0.92);
      --surface-inset: rgba(7, 10, 11, 0.5);
      --hairline: rgba(246, 218, 160, 0.12);
      --hairline-strong: rgba(246, 218, 160, 0.24);
      --ink: #F6EFE1;
      --ink-soft: #C8BBA6;
      --muted: #82796D;
      --gold: #F5B84F;
      --gold-soft: #FFD987;
      --gold-glow: rgba(245, 184, 79, 0.35);
      --gold-wash: rgba(245, 184, 79, 0.09);
      --green: #41EDA0;
      --green-bright: #6BFFBE;
      --green-glow: rgba(65, 237, 160, 0.35);
      --green-wash: rgba(65, 237, 160, 0.09);
      --red: #FF5367;
      --red-bright: #FF7C8B;
      --amber: #F0A63A;
      --amber-glow: rgba(240, 166, 58, 0.35);
      --amber-wash: rgba(240, 166, 58, 0.10);
      --blue: #6FAEFF;
      --blue-glow: rgba(111, 174, 255, 0.32);
      --blue-wash: rgba(111, 174, 255, 0.10);
      --cream: #F7E6C1;
      --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      --font-body: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
      --r-sm: 6px;
      --r-md: 8px;
      --r-lg: 12px;
      --r-pill: 999px;
      --panel-radius: 8px;
      --shadow-card: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 22px 70px rgba(0, 0, 0, 0.30);
      --shadow-hero: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 28px 80px rgba(0, 0, 0, 0.42);
      --pancake-field:
        repeating-radial-gradient(circle at 17% 12%, rgba(247, 213, 143, 0.12) 0 1px, transparent 1px 52px),
        repeating-radial-gradient(circle at 82% 18%, rgba(65, 237, 160, 0.10) 0 1px, transparent 1px 64px);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: var(--bg-void);
    }

    body {
      font-family: var(--font-body);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      background:
        linear-gradient(120deg, rgba(5, 5, 5, 0.98), rgba(12, 13, 11, 0.96) 42%, rgba(4, 14, 12, 0.94) 100%),
        var(--pancake-field), var(--bg-void);
    }

    ::selection {
      background: rgba(245, 184, 79, 0.25);
    }

    /* ===== Topbar ===== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 12px 28px;
      min-height: 66px;
      border-bottom: 1px solid var(--hairline);
      background: rgba(5, 6, 6, 0.74);
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .coin {
      width: 40px;
      height: 40px;
      flex: none;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #1a1206;
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: 11px;
      background: linear-gradient(145deg, rgba(255, 246, 215, 0.96), rgba(248, 184, 78, 0.94) 46%, rgba(129, 75, 28, 0.9));
      border: 1px solid rgba(255, 226, 166, 0.5);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 0 22px rgba(245, 184, 79, 0.28);
    }

    .brand .n {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 16px;
      color: var(--cream);
      line-height: 1.05;
    }

    .brand .s {
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--gold-soft);
    }

    .rail {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      padding: 6px 11px;
      border-radius: var(--r-pill);
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      border: 1px solid var(--hairline);
      background: rgba(255, 255, 255, 0.035);
      color: var(--ink-soft);
    }

    .pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 12px currentColor;
    }

    .pill.ok {
      color: var(--green);
      border-color: var(--green-glow);
      background: var(--green-wash);
    }

    .pill.ok .dot {
      animation: pulse 2.2s var(--ease-out) infinite;
    }

    .pill.warn {
      color: var(--amber);
      border-color: var(--amber-glow);
      background: var(--amber-wash);
    }

    .pill.muted {
      color: #7e8491;
      border-color: rgba(126, 132, 145, 0.2);
      background: rgba(126, 132, 145, 0.07);
    }

    .pill.muted .dot {
      box-shadow: none;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .32
      }
    }

    .spacer {
      flex: 1;
    }

    .cyc-info {
      display: grid;
      gap: 2px;
      justify-items: end;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }

    .cyc-info .lb {
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .cyc-info .t {
      color: var(--ink-soft);
      font-weight: 600;
    }

    .cyc-info .t b {
      color: var(--green);
      font-weight: 600;
    }

    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 22px 28px 44px;
    }

    /* ===== Portfolio band ===== */
    .band {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(420px, 0.92fr);
      gap: 22px;
      margin-bottom: 18px;
      padding: 26px 30px;
      border: 1px solid rgba(246, 218, 160, 0.16);
      border-radius: var(--panel-radius);
      background: linear-gradient(90deg, rgba(23, 19, 13, 0.94), rgba(11, 18, 15, 0.86));
      box-shadow: var(--shadow-hero);
    }

    .eyebrow {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--gold-soft);
      margin-bottom: 12px;
    }

    .total-row {
      display: flex;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
    }

    .total {
      font-family: var(--font-mono);
      font-weight: 500;
      font-size: 52px;
      line-height: 0.9;
      color: var(--cream);
      letter-spacing: -0.01em;
    }

    .delta-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: var(--r-pill);
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 600;
    }

    .delta-chip.neg {
      color: var(--red);
      border: 1px solid rgba(255, 83, 103, 0.4);
      background: rgba(255, 83, 103, 0.10);
    }

    .delta-chip.pos {
      color: var(--green);
      border: 1px solid var(--green-glow);
      background: var(--green-wash);
    }

    .seed {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 22px;
    }

    .stat {
      padding: 14px 16px;
      border: 1px solid rgba(246, 218, 160, 0.1);
      border-radius: var(--r-md);
      background: rgba(0, 0, 0, 0.2);
    }

    .stat .k {
      display: block;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .stat .v {
      font-family: var(--font-mono);
      font-size: 21px;
      color: var(--ink);
    }

    .stat .v small {
      font-size: 13px;
      color: var(--muted);
    }

    .stat .v.gold {
      color: var(--gold);
    }

    .pos-wrap {
      border-left: 1px solid var(--hairline);
      padding-left: 22px;
    }

    .pos-wrap .k {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 12px;
      display: block;
    }

    .pos-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .pos-row {
      display: grid;
      grid-template-columns: 96px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border: 1px solid rgba(246, 218, 160, 0.1);
      border-radius: var(--r-md);
      background: rgba(0, 0, 0, 0.18);
    }

    .pos-row .pair {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 14px;
      color: var(--cream);
    }

    .pos-row .side {
      font-family: var(--font-mono);
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--green);
    }

    .pos-row .px {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
    }

    .pos-row .px span {
      color: var(--ink-soft);
    }

    .pos-row .mkt {
      text-align: right;
      font-family: var(--font-mono);
      font-size: 15px;
      color: var(--ink);
    }

    .pos-row .pnl {
      text-align: right;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
    }

    /* ===== Ledger panel ===== */
    .panel {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--hairline);
      border-radius: var(--panel-radius);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01)), var(--surface-panel);
      box-shadow: var(--shadow-card);
    }

    .p-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 62px;
      padding: 15px 20px;
      border-bottom: 1px solid rgba(246, 218, 160, 0.09);
    }

    .kicker {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--gold-soft);
      margin-bottom: 5px;
    }

    .p-head h2 {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 19px;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    .pg-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .range {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }

    .pg-btns {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pg {
      min-width: 34px;
      height: 34px;
      padding: 0 10px;
      border-radius: var(--r-md);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
      border: 1px solid var(--hairline);
      background: rgba(0, 0, 0, 0.2);
      display: grid;
      place-items: center;
      transition: all .18s ease;
    }

    .pg:hover {
      border-color: var(--hairline-strong);
      color: var(--cream);
    }

    .pg.active {
      color: #151006;
      background: var(--gold);
      border-color: var(--gold);
    }

    .pg.arrow {
      font-size: 15px;
    }

    .pg[disabled] {
      opacity: .35;
      cursor: default;
      pointer-events: none;
    }

    .cycles {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px 20px 22px;
    }

    .cycle {
      border: 1px solid var(--hairline);
      border-radius: var(--r-lg);
      background: rgba(0, 0, 0, 0.16);
      overflow: hidden;
    }

    .cy-head {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 18px;
      padding: 15px 18px;
      cursor: pointer;
      transition: background .2s var(--ease-out);
    }

    .cy-head:hover {
      background: rgba(246, 218, 160, 0.045);
    }

    .seq {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: var(--r-md);
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 13px;
      color: var(--gold);
      border: 1px solid var(--gold-glow);
      background: var(--gold-wash);
    }

    .cy-time {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 600;
      color: var(--cream);
      letter-spacing: 0.01em;
    }

    .cy-time small {
      font-size: 11px;
      color: var(--muted);
    }

    .cy-sub {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 2px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border-radius: var(--r-pill);
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
    }

    .chip .g {
      font-size: 9px;
    }

    .cy-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .cy-total {
      text-align: right;
    }

    .cy-total .v {
      font-family: var(--font-mono);
      font-size: 16px;
      color: var(--ink);
    }

    .cy-total .d {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
    }

    .chev {
      font-family: var(--font-mono);
      font-size: 16px;
      color: var(--gold-soft);
      width: 16px;
      text-align: center;
    }

    .detail {
      padding: 4px 16px 18px;
      border-top: 1px solid rgba(246, 218, 160, 0.08);
    }

    .decisions {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 12px;
      padding-top: 14px;
    }

    .dcard {
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent), var(--surface-inset);
      padding: 14px 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .dc-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .dc-pair {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 16px;
      color: var(--cream);
    }

    .dc-price {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 2px;
    }

    .dc-price small {
      color: var(--muted);
      font-size: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: var(--r-pill);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .dc-actsub {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      margin-top: 5px;
      text-align: right;
    }

    .dc-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .spill {
      display: inline-flex;
      flex-direction: column;
      gap: 1px;
      padding: 6px 10px;
      border-radius: var(--r-sm);
      border: 1px solid var(--hairline);
      background: rgba(0, 0, 0, 0.24);
    }

    .spill .k {
      font-family: var(--font-mono);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .spill .v {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
    }

    .contribs {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding-top: 2px;
    }

    .contribs .hd {
      font-family: var(--font-mono);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .crow {
      display: grid;
      grid-template-columns: 80px 1fr 46px;
      align-items: center;
      gap: 10px;
    }

    .crow .nm {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-soft);
    }

    .track {
      position: relative;
      height: 16px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.4);
      box-shadow: inset 0 0 0 1px rgba(246, 218, 160, 0.06);
      overflow: hidden;
    }

    .track .mid {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(246, 218, 160, 0.16);
    }

    .track .fill {
      position: absolute;
      top: 2px;
      bottom: 2px;
      border-radius: 3px;
    }

    .track .fill.pos {
      background: linear-gradient(90deg, #0B6B4E, var(--green));
      box-shadow: 0 0 10px var(--green-glow);
    }

    .track .fill.neg {
      background: linear-gradient(90deg, var(--red), #B32C3A);
      box-shadow: 0 0 10px rgba(255, 83, 103, 0.3);
    }

    .track .fill.zero {
      background: var(--muted);
    }

    .crow .v {
      text-align: right;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
    }

    .buy-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      border-radius: var(--r-sm);
      overflow: hidden;
      border: 1px solid var(--green-glow);
      background: var(--green-glow);
    }

    .buy-grid .cell {
      padding: 8px 10px;
      background: rgba(5, 14, 11, 0.86);
    }

    .buy-grid .k {
      display: block;
      font-family: var(--font-mono);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .buy-grid .v {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink);
    }

    .buy-grid .v.g {
      color: var(--green-bright);
    }

    .buy-grid .v.a {
      color: var(--gold);
    }

    .reason {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding-top: 8px;
      border-top: 1px solid rgba(246, 218, 160, 0.07);
    }

    .reason .mk {
      flex: none;
      font-family: var(--font-mono);
      font-size: 11px;
      margin-top: 2px;
    }

    .reason p {
      font-size: 11.5px;
      color: var(--ink-soft);
      line-height: 1.5;
    }

    /* tone helpers */
    .t-green {
      color: var(--green);
    }

    .t-blue {
      color: var(--blue);
    }

    .t-amber {
      color: var(--amber);
    }

    .t-muted {
      color: var(--muted);
    }

    .t-red {
      color: var(--red);
    }

    .t-ink {
      color: var(--ink-soft);
    }

    .t-greenb {
      color: var(--green-bright);
    }

    .t-redb {
      color: var(--red-bright);
    }

    .badge.green,
    .chip.green {
      color: var(--green);
      border: 1px solid var(--green-glow);
      background: var(--green-wash);
    }

    .badge.blue,
    .chip.blue {
      color: var(--blue);
      border: 1px solid var(--blue-glow);
      background: var(--blue-wash);
    }

    .badge.amber,
    .chip.amber {
      color: var(--amber);

      const a = actionMeta(d);

      const scoreTone = d.score >= 0.5 ? 't-green' : d.score >= 0.3 ? 't-blue' : 't-muted';
      const rsiTone = (d.rsi < 35 || d.rsi > 65) ? 't-amber' : 't-ink';
      const desiredLong = d.desired === 'LONG_MICRO';

      const contribs = d.contribs.map(c => {
        const pct = Math.min(Math.abs(c.value) / 0.40, 1) * 50;
        let fillCls, fillStyle, valTone;
        if (c.value === 0) { fillCls = 'zero'; fillStyle = 'left:calc(50% - 1px);width:2px;'; valTone = 't-muted'; }
        else if (c.value > 0) { fillCls = 'pos'; fillStyle = 'left:50%;width:' + pct + '%;'; valTone = 't-greenb'; }
        else { fillCls = 'neg'; fillStyle = 'right:50%;width:' + pct + '%;'; valTone = 't-redb'; }
        const sign = c.value > 0 ? '+' : c.value < 0 ? MINUS : '\u00B1';
        return `<div class="crow">
      <span class="nm">${c.name}</span>
      <span class="track"><span class="mid"></span><span class="fill ${fillCls}" style="${fillStyle}"></span></span>
      <span class="v ${valTone}">${sign}${Math.abs(c.value).toFixed(2)}</span>
    </div>`;
      }).join('');

      const buyBlock = d.action === 'WOULD_BUY' ? `

      <div class="cell"><span class="k">Fee</span><span class="v a">${eur(d.fee, 4)}</span></div>
    </div>` : '';

      return `<div class="dcard" style="border-left:3px solid var(--${a.tone === 'muted' ? 'muted' : a.tone});">
    <div class="dc-top">
      <div><div class="dc-pair">${d.pair}</div><div class="dc-price">${price(d.price)} <small>EUR</small></div></div>

    </div>

    ${buyBlock}
    <div class="reason"><span class="mk t-${a.tone}">\u203A</span><p>${d.reason}</p></div>

    /* ================= RENDER: one cycle ================= */

      const holds = c.decisions.filter(d => d.action === 'WOULD_HOLD').length;
      const flat = c.decisions.filter(d => d.action === 'NO_ORDER').length;
      const parts = []; if (buys) parts.push(buys + ' buy'); if (holds) parts.push(holds + ' hold'); if (flat) parts.push(flat + ' flat');
      const open = !!state.open[c.id];

      const chips = c.decisions.map(d => {
        const a = actionMeta(d);
        return `<span class="chip ${a.tone}"><span class="g">${a.glyph}</span>${d.pair.split('/')[0]}</span>`;

      const detail = open ? `<div class="detail"><div class="decisions">${c.decisions.map(decisionCard).join('')}</div></div>` : '';

      return `<article class="cycle">
    <div class="cy-head" data-id="${c.id}">
      <div style="display:flex;align-items:center;gap:14px;">
        <span class="seq">${String(c.seq).padStart(2, '0')}</span>
        <div>
          <div class="cy-time">${c.time}<small> UTC</small></div>

      <div class="chips">${chips}</div>
      <div class="cy-right">
        <div class="cy-total"><div class="v">${eur(c.total)}</div><div class="d ${dTone}">${signEur(delta)} \u00B7 ${signPct(delta / prevTotal * 100)}</div></div>
        <span class="chev">${open ? '\u25BE' : '\u25B8'}</span>
      </div>
    </div>
    ${detail}
  </article>`;
    }

    /* ================= RENDER: ledger + paging ================= */
    function renderLedger() {
      const withPrev = DATA.map((c, i) => ({ c, prev: i > 0 ? DATA[i - 1].total : 75 }));
      const newestFirst = withPrev.slice().reverse();
      const pageCount = Math.ceil(newestFirst.length / PAGE_SIZE);
      if (state.page > pageCount - 1) state.page = pageCount - 1;
      const start = state.page * PAGE_SIZE;
      const slice = newestFirst.slice(start, start + PAGE_SIZE);

      document.getElementById('cycles').innerHTML = slice.map(x => cycleCard(x.c, x.prev)).join('');
      document.getElementById('range').textContent =
        'Showing ' + (start + 1) + '\u2013' + (start + slice.length) + ' of ' + newestFirst.length;

      let pg = `<button class="pg arrow" data-nav="prev" ${state.page === 0 ? 'disabled' : ''}>\u2039</button>`;
      for (let i = 0; i < pageCount; i++)
        pg += `<button class="pg ${i === state.page ? 'active' : ''}" data-page="${i}">${i + 1}</button>`;
      pg += `<button class="pg arrow" data-nav="next" ${state.page >= pageCount - 1 ? 'disabled' : ''}>\u203A</button>`;
      document.getElementById('paging').innerHTML = pg;
    }

    /* ================= EVENTS (delegated) ================= */
    document.addEventListener('click', e => {
      const head = e.target.closest('.cy-head');
      if (head) { const id = head.dataset.id; state.open[id] = !state.open[id]; renderLedger(); return; }
      const pageBtn = e.target.closest('[data-page]');
      if (pageBtn) { state.page = +pageBtn.dataset.page; renderLedger(); return; }
      const nav = e.target.closest('[data-nav]');
      if (nav) {
        const pageCount = Math.ceil(DATA.length / PAGE_SIZE);
        state.page = nav.dataset.nav === 'prev' ? Math.max(0, state.page - 1) : Math.min(pageCount - 1, state.page + 1);
        renderLedger();
      }
    });

    /* ================= INIT ================= */
    state.open[DATA[DATA.length - 1].id] = true; // newest cycle expanded by default
    renderPortfolio();
    renderLedger();
  </script>
</body>

</html>
