  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

e {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"d351eb1a-d092-4de0-9897-37d4e88ec9d0\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"e3a8ee33-895b-4568-93e5-d1330862ff0d\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"6d0d05e3-0de0-4e71-9ad5-dc5b72686c9c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Blynai Capital — Color tokens\n   Warm butter-gold micro-hedge-fund identity on near-black.\n   Semantics: green=profit/long/approved, red=loss/rejected/kill,\n   amber=warning/cooldown, blue=info/hold/neutral. Gold/cream=brand. */\n:root {\n  /* Base surfaces — warm-tinted near-black (from ground-truth mockup) */\n  --bg-void: #050505;\n  --bg-deep: #090908;\n  --bg-0: #050505;\n  --bg-1: #0B0C0A;\n  --surface-panel: rgba(17, 18, 15, 0.92);\n  --surface-strong: rgba(24, 25, 20, 0.96);\n  --surface-elev: rgba(28, 29, 23, 0.96);\n  --surface-inset: rgba(7, 10, 11, 0.92);\n  --surface-soft: rgba(246, 218, 160, 0.045);\n\n  --hairline: rgba(246, 218, 160, 0.12);\n  --hairline-strong: rgba(246, 218, 160, 0.24);\n  --line: var(--hairline);\n  --line-strong: var(--hairline-strong);\n\n  /* Text — warm cream inks */\n  --ink: #F6EFE1;\n  --ink-soft: #C8BBA6;\n  --muted: #82796D;\n  --text-1: var(--ink);\n  --text-2: var(--ink-soft);\n  --text-3: var(--muted);\n  --text-inverse: #151006;\n\n  /* Brand — butter gold / pancake / cream */\n  --gold: #F5B84F;\n  --gold-soft: #FFD987;\n  --gold-deep: #B97F2E;\n  --cream: #F7E6C1;\n  --cream-warm: #F4CF8A;\n  --gold-glow: rgba(245, 184, 79, 0.35);\n  --gold-wash: rgba(245, 184, 79, 0.09);\n  --accent-brand: var(--gold);\n\n  /* Green — profit / long / approved / OK */\n  --green: #41EDA0;\n  --green-bright: #6BFFBE;\n  --green-deep: #0B6B4E;\n  --green-dim: #1E8F68;\n  --green-glow: rgba(65, 237, 160, 0.35);\n  --green-wash: rgba(65, 237, 160, 0.09);\n  --pos: var(--green);\n\n  /* Red — loss / rejected / error / kill switch */\n  --red: #FF5367;\n  --red-bright: #FF7C8B;\n  --red-dim: #B32C3A;\n  --red-glow: rgba(255, 83, 103, 0.40);\n  --red-wash: rgba(255, 83, 103, 0.10);\n  --neg: var(--red);\n\n  /* Amber — warning / cooldown / risk attention */\n  --amber: #F0A63A;\n  --amber-bright: #FFC062;\n  --amber-dim: #A66E12;\n  --amber-glow: rgba(240, 166, 58, 0.35);\n  --amber-wash: rgba(240, 166, 58, 0.10);\n  --warn: var(--amber);\n\n  /* Blue — info / hold / neutral */\n  --blue: #6FAEFF;\n  --blue-bright: #9AC6FF;\n  --blue-dim: #345F9E;\n  --blue-glow: rgba(111, 174, 255, 0.32);\n  --blue-wash: rgba(111, 174, 255, 0.10);\n  --info: var(--blue);\n\n  /* Semantic aliases */\n  --text-body: var(--ink);\n  --text-label: var(--muted);\n  --surface-card: var(--surface-panel);\n}\n\n/* Blynai Capital — Typography tokens\n   Display/UI: Space Grotesk. Body: IBM Plex Sans. Numbers/mono: IBM Plex Mono (tabular). */\n:root {\n  --font-display: \"Space Grotesk\", ui-sans-serif, system-ui, sans-serif;\n  --font-body: \"IBM Plex Sans\", ui-sans-serif, system-ui, sans-serif;\n  --font-mono: \"IBM Plex Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n\n  /* Type scale */\n  --fs-mega: 44px;\n  --fs-h1: 30px;\n  --fs-h2: 22px;\n  --fs-h3: 17px;\n  --fs-body: 14px;\n  --fs-sm: 12.5px;\n  --fs-label: 11px;   /* uppercase eyebrow labels */\n  --fs-micro: 10px;\n\n  --lh-tight: 1.05; /* @kind other */\n  --lh-snug: 1.25;  /* @kind other */\n  --lh-body: 1.5;   /* @kind other */\n\n  --ls-label: 0.14em; /* @kind other */\n  --ls-mono: 0.01em;  /* @kind other */\n\n  --fw-regular: 400;  /* @kind other */\n  --fw-medium: 500;   /* @kind other */\n  --fw-semibold: 600; /* @kind other */\n  --fw-bold: 700;     /* @kind other */\n\n  /* tabular numerals for all data */\n  --num: \"tnum\" 1, \"lnum\" 1; /* @kind other */\n}\n\n/* Blynai Capital — Radii, shadows, spacing, motion */\n:root {\n  /* Spacing (4px base) */\n  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;\n  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px;\n\n  /* Radii — the terminal uses a tight 8px panel radius */\n  --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-xl: 18px; --r-pill: 999px;\n  --panel-radius: 8px;\n\n  /* Shadows — deep, soft, cinematic */\n  --shadow-card: inset 0 1px 0 rgba(255,255,255,0.04), 0 22px 70px rgba(0,0,0,0.30);\n  --shadow-hero: inset 0 1px 0 rgba(255,255,255,0.04), 0 28px 80px rgba(0,0,0,0.42);\n  --shadow-pop: 0 24px 60px -24px rgba(0,0,0,0.9);\n  --ring-inset: inset 0 0 0 1px var(--hairline);\n\n  /* Glows keyed to semantics */\n  --glow-green: 0 0 0 1px var(--green-glow), 0 0 24px -4px var(--green-glow);\n  --glow-red: 0 0 0 1px var(--red-glow), 0 0 26px -4px var(--red-glow);\n  --glow-amber: 0 0 0 1px var(--amber-glow), 0 0 24px -4px var(--amber-glow);\n  --glow-blue: 0 0 0 1px var(--blue-glow), 0 0 24px -4px var(--blue-glow);\n  --glow-gold: 0 0 0 1px var(--gold-glow), 0 0 26px -4px var(--gold-glow);\n\n  /* Pancake / coin dot-field — reusable brand background layers */\n  --pancake-field:\n    repeating-radial-gradient(circle at 17% 12%, rgba(247,213,143,0.12) 0 1px, transparent 1px 52px),\n    repeating-radial-gradient(circle at 82% 18%, rgba(65,237,160,0.10) 0 1px, transparent 1px 64px); /* @kind other */\n\n  /* Motion */\n  --ease-out: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur: 220ms;      /* @kind other */\n}\n\n<\u002Fstyle>\n<script src=\"c0bba4c9-f66d-41d5-afac-8e157a091dcf\"><\u002Fscript>\n<style>\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  html { background: var(--bg-void); scroll-behavior: smooth; }\n  body {\n    font-family: var(--font-body); color: var(--ink); font-size: 15px; line-height: 1.55;\n    -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden;\n    background:\n      linear-gradient(120deg, rgba(5,5,5,0.98), rgba(12,13,11,0.96) 42%, rgba(4,14,12,0.94) 100%),\n      var(--pancake-field), var(--bg-void);\n  }\n  body::before { content:\"\"; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.5;\n    background: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.014) 1px, transparent 1px);\n    background-size: 76px 76px; -webkit-mask-image: linear-gradient(to bottom, black, transparent 88%); mask-image: linear-gradient(to bottom, black, transparent 88%); }\n  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }\n  .lucide { width: 16px; height: 16px; stroke-width: 2; }\n  .wrap { position: relative; z-index: 1; max-width: 1140px; margin: 0 auto; padding: 0 40px; }\n\n  /* eyebrow / section headers */\n  .kicker { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--gold-soft); }\n  .kicker .lucide { width: 13px; height: 13px; }\n  section { padding: 60px 0; border-top: 1px solid var(--hairline); }\n  section > .wrap > h2 { font-family: var(--font-display); font-weight: 600; font-size: 34px; letter-spacing: -0.02em; color: var(--ink); margin: 14px 0 8px; }\n  section > .wrap > .lede { color: var(--ink-soft); font-size: 15.5px; max-width: 62ch; }\n\n  /* ===== HERO ===== */\n  .hero { position: relative; overflow: hidden; padding: 96px 0 84px; border-top: 0; }\n  .hero::before { content:\"\"; position: absolute; top: -180px; right: -80px; width: 620px; height: 620px; border-radius: 50%;\n    border: 1px solid rgba(245,184,79,0.13); background: repeating-radial-gradient(circle, rgba(245,184,79,0.07) 0 2px, transparent 2px 38px); }\n  .hero::after { content:\"\"; position: absolute; bottom: -220px; left: -120px; width: 520px; height: 520px; border-radius: 50%;\n    border: 1px solid rgba(65,237,160,0.12); background: repeating-radial-gradient(circle, rgba(65,237,160,0.06) 0 1px, transparent 1px 34px); }\n  .hero .wrap { position: relative; z-index: 1; }\n  .lockup { display: flex; align-items: center; gap: 16px; margin-bottom: 30px; }\n  .coin { position: relative; width: 58px; height: 58px; flex: none; border-radius: 50%; display: grid; place-items: center;\n    color: #1a1206; font-family: var(--font-mono); font-weight: 800; font-size: 15px;\n    background: linear-gradient(145deg, rgba(255,246,215,0.96), rgba(248,184,78,0.94) 46%, rgba(129,75,28,0.9));\n    border: 1px solid rgba(255,226,166,0.5); box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 0 30px rgba(245,184,79,0.32); }\n  .coin::before { content:\"\"; position: absolute; inset: 9px; border: 1px solid rgba(42,23,7,0.32); border-radius: 50%; }\n  .coin::after { content:\"\"; position: absolute; left: 11px; right: 11px; bottom: 14px; height: 8px; border-top: 1px solid rgba(43,25,8,0.4); border-bottom: 1px solid rgba(43,25,8,0.3); }\n  .coin span { position: relative; z-index: 1; }\n  .lockup .ln { font-family: var(--font-display); font-weight: 600; font-size: 20px; line-height: 1.1; }\n  .lockup .ls { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--gold-soft); }\n  .hero h1 { font-family: var(--font-display); font-weight: 700; font-size: 76px; line-height: 0.95; letter-spacing: -0.03em; color: var(--cream); text-shadow: 0 0 48px rgba(245,184,79,0.16); max-width: 16ch; }\n  .hero h1 em { font-style: normal; color: var(--gold); }\n  .hero .sub { margin-top: 24px; font-size: 18px; color: var(--ink-soft); max-width: 60ch; line-height: 1.6; }\n  .hero .sub b { color: var(--cream); font-weight: 500; }\n  .hero .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }\n  .hero .chips span { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: var(--r-pill); border: 1px solid var(--hairline); background: rgba(0,0,0,0.24); font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); }\n  .hero .chips .lucide { width: 13px; height: 13px; color: var(--gold); }\n\n  /* generic card grid */\n  .grid { display: grid; gap: 16px; margin-top: 30px; }\n  .g2 { grid-template-columns: repeat(2, 1fr); }\n  .g3 { grid-template-columns: repeat(3, 1fr); }\n  .g4 { grid-template-columns: repeat(4, 1fr); }\n  .card { border: 1px solid var(--hairline); border-radius: var(--panel-radius); background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.008)), var(--surface-panel); box-shadow: var(--shadow-card); overflow: hidden; }\n  .card .cbody { padding: 20px; }\n  .card h3 { font-family: var(--font-display); font-weight: 600; font-size: 16px; margin-bottom: 6px; }\n  .card p { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; }\n  .card .ic { width: 38px; height: 38px; border-radius: var(--r-md); display: grid; place-items: center; margin-bottom: 14px; }\n\n  /* ===== COLOR SWATCHES ===== */\n  .swatch { border: 1px solid var(--hairline); border-radius: var(--panel-radius); overflow: hidden; background: var(--surface-panel); }\n  .swatch .chip { height: 76px; }\n  .swatch .meta { padding: 12px 14px; }\n  .swatch .meta .nm { font-size: 13px; font-weight: 600; color: var(--ink); }\n  .swatch .meta .hex { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); margin-top: 2px; }\n  .swatch .meta .tok { font-family: var(--font-mono); font-size: 10.5px; color: var(--gold-soft); margin-top: 5px; }\n\n  /* semantics table */\n  .sem { margin-top: 26px; border: 1px solid var(--hairline); border-radius: var(--panel-radius); overflow: hidden; }\n  .sem-row { display: grid; grid-template-columns: 130px 1fr; align-items: center; gap: 18px; padding: 15px 20px; border-bottom: 1px solid var(--hairline); }\n  .sem-row:last-child { border-bottom: 0; }\n  .sem-row .tag { display: inline-flex; align-items: center; gap: 9px; font-family: var(--font-mono); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }\n  .sem-row .tag .dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 14px currentColor; }\n  .sem-row .desc { color: var(--ink-soft); font-size: 14px; }\n  .sem-row .desc b { color: var(--ink); font-weight: 600; }\n\n  /* type specimens */\n  .spec { border: 1px solid var(--hairline); border-radius: var(--panel-radius); background: var(--surface-panel); padding: 24px 26px; }\n  .spec + .spec { margin-top: 16px; }\n  .spec .tag { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold-soft); margin-bottom: 14px; }\n  .spec .display { font-family: var(--font-display); font-weight: 700; font-size: 48px; letter-spacing: -0.02em; color: var(--cream); line-height: 1; }\n  .spec .bodyt { font-family: var(--font-body); font-size: 17px; color: var(--ink-soft); line-height: 1.6; max-width: 60ch; }\n  .spec .monot { font-family: var(--font-mono); font-size: 30px; color: var(--green-bright); font-variant-numeric: tabular-nums; }\n  .spec .row2 { display: flex; align-items: baseline; gap: 24px; flex-wrap: wrap; margin-top: 12px; }\n  .spec .row2 span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }\n  .scale { display: grid; gap: 2px; margin-top: 4px; }\n  .scale div { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px dashed rgba(246,218,160,0.08); }\n  .scale div:last-child { border-bottom: 0; }\n  .scale .lab { width: 92px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }\n  .scale .ex { font-family: var(--font-display); color: var(--ink); font-weight: 600; white-space: nowrap; }\n\n  /* motif specimens */\n  .motif { position: relative; height: 200px; border: 1px solid var(--hairline); border-radius: var(--panel-radius); overflow: hidden; display: grid; place-items: center; }\n  .motif .cap { position: absolute; left: 14px; bottom: 12px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); background: rgba(0,0,0,0.5); padding: 4px 9px; border-radius: var(--r-sm); border: 1px solid var(--hairline); }\n  .m-dots { background: var(--pancake-field), var(--surface-inset); }\n  .m-rings { background: var(--surface-inset); }\n  .m-rings .seal { width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(255,226,166,0.4);\n    background: repeating-radial-gradient(circle, rgba(255,226,166,0.17) 0 1px, transparent 1px 11px), linear-gradient(145deg, rgba(248,208,128,0.3), rgba(13,16,14,0.94));\n    box-shadow: inset 0 0 34px rgba(245,184,79,0.12), 0 0 34px rgba(65,237,160,0.14); position: relative; }\n  .m-rings .seal::before { content:\"\"; position: absolute; inset: 13px; border-radius: 50%; border: 1px dashed rgba(255,226,166,0.34); }\n  .m-rings .seal::after { content:\"\"; position: absolute; inset: 34px; border-radius: 50%; border: 1px solid rgba(65,237,160,0.36); background: rgba(65,237,160,0.09); }\n  .m-rings .seal .lucide { width: 22px; height: 22px; color: var(--green-bright); z-index: 1; }\n  .m-glow { background: var(--surface-inset); gap: 20px; grid-auto-flow: column; }\n  .orb { width: 66px; height: 66px; border-radius: 50%; }\n  .orb.g { background: var(--green); box-shadow: var(--glow-green); }\n  .orb.r { background: var(--red); box-shadow: var(--glow-red); }\n  .orb.a { background: var(--amber); box-shadow: var(--glow-amber); }\n  .orb.b { background: var(--blue); box-shadow: var(--glow-blue); }\n  .orb.gd { background: var(--gold); box-shadow: var(--glow-gold); }\n\n  /* component samples */\n  .demo { border: 1px solid var(--hairline); border-radius: var(--panel-radius); background: var(--surface-inset); padding: 26px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }\n  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: var(--r-pill); font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; border: 1px solid var(--hairline); background: rgba(255,255,255,0.035); color: var(--ink-soft); }\n  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 12px currentColor; }\n  .pill.ok { color: var(--green); border-color: var(--green-glow); background: var(--green-wash); }\n  .pill.warn { color: var(--amber); border-color: var(--amber-glow); background: var(--amber-wash); }\n  .pill.info { color: var(--blue); border-color: var(--blue-glow); background: var(--blue-wash); }\n  .kill { display: inline-flex; align-items: center; gap: 9px; padding: 0 18px; min-height: 42px; border-radius: var(--r-md);\n    font-family: var(--font-mono); font-weight: 700; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #ffdce1;\n    border: 1px solid rgba(255,83,103,0.62); background: linear-gradient(180deg, rgba(255,83,103,0.22), rgba(255,83,103,0.07)), rgba(31,7,11,0.96); box-shadow: 0 0 24px rgba(255,83,103,0.2); }\n  .kill .ring { width: 13px; height: 13px; border: 2px solid currentColor; border-radius: 50%; position: relative; }\n  .kill .ring::after { content:\"\"; position: absolute; left: 50%; top: -2px; width: 2px; height: 7px; background: currentColor; transform: translateX(-50%); }\n  .rdot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--green-glow); background: var(--green-wash); color: var(--green); box-shadow: 0 0 18px rgba(65,237,160,0.18); }\n  .rdot .lucide { width: 14px; height: 14px; }\n  .scorebar { flex: 1; min-width: 200px; height: 22px; border-radius: 5px; background: rgba(0,0,0,0.4); box-shadow: inset 0 0 0 1px rgba(246,218,160,0.06); position: relative; overflow: hidden; }\n  .scorebar .mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(246,218,160,0.14); }\n  .scorebar .fill { position: absolute; top: 3px; bottom: 3px; left: 50%; width: 42%; border-radius: 4px; background: linear-gradient(90deg, var(--green-deep), var(--green)); box-shadow: 0 0 16px var(--green-glow); }\n\n  .cta { display: inline-flex; align-items: center; gap: 9px; margin-top: 26px; padding: 12px 20px; border-radius: var(--r-md); font-family: var(--font-mono); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: #06170f; background: var(--green); text-decoration: none; box-shadow: 0 0 26px -4px var(--green-glow); }\n  .cta:hover { background: var(--green-bright); }\n\n  footer { padding: 46px 0 70px; border-top: 1px solid var(--hairline); }\n  footer .wrap { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; color: var(--muted); font-family: var(--font-mono); font-size: 12px; }\n  .voice-list { display: grid; gap: 10px; margin-top: 20px; }\n  .voice-list .vi { display: grid; grid-template-columns: 24px 1fr; gap: 12px; align-items: start; padding: 12px 0; border-bottom: 1px dashed rgba(246,218,160,0.08); }\n  .voice-list .vi:last-child { border-bottom: 0; }\n  .voice-list .vi .lucide { color: var(--green); margin-top: 2px; }\n  .voice-list .vi.no .lucide { color: var(--red); }\n  .voice-list .vi b { color: var(--ink); }\n  .voice-list .vi span { color: var(--ink-soft); font-size: 14px; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n  <!-- HERO -->\n  <header class=\"hero\">\n    <div class=\"wrap\">\n      <div class=\"lockup\">\n        <span class=\"coin\"><span>BC<\u002Fspan><\u002Fspan>\n        <div><div class=\"ln\">Blynai Capital<\u002Fdiv><div class=\"ls\">Bykovas-Finance Lab<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <h1>The <em>Design Guide<\u002Fem><\u002Fh1>\n      <p class=\"sub\">Blynai Capital is a <b>fake-but-beautiful micro hedge fund<\u002Fb> — a self-hosted, deterministic, explainable micro-trading bot. Serious engineering, unserious fund energy. This guide holds the foundations that make every screen feel like a premium trading cockpit with a quiet Lithuanian pancake soul.<\u002Fp>\n      <div class=\"chips\">\n        <span><i data-lucide=\"moon\" class=\"lucide\"><\u002Fi>Cinematic dark terminal<\u002Fspan>\n        <span><i data-lucide=\"circle-dot\" class=\"lucide\"><\u002Fi>Pancake / coin motifs<\u002Fspan>\n        <span><i data-lucide=\"hash\" class=\"lucide\"><\u002Fi>Tabular, traceable numbers<\u002Fspan>\n        <span><i data-lucide=\"gem\" class=\"lucide\"><\u002Fi>Butter-gold luxury accents<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- BRAND IDENTITY -->\n  <section>\n    <div class=\"wrap\">\n      <span class=\"kicker\"><i data-lucide=\"sparkles\" class=\"lucide\"><\u002Fi>Brand<\u002Fspan>\n      <h2>Identity &amp; motifs<\u002Fh2>\n      <p class=\"lede\">The brand lives in three quiet signatures: a butter-gold coin, a concentric fund-seal, and a field of pancake-like radar rings. Used sparingly, they read as luxury and precision — never cartoon.<\u002Fp>\n      <div class=\"grid g3\">\n        <div class=\"card\"><div class=\"cbody\">\n          <div class=\"ic\" style=\"background:var(--gold-wash);box-shadow:0 0 0 1px rgba(245,184,79,0.24)\"><i data-lucide=\"circle-dollar-sign\" class=\"lucide\" style=\"color:var(--gold)\"><\u002Fi><\u002Fdiv>\n          <h3>The coin mark<\u002Fh3>\n          <p>A round butter-gold token stamped “BC”, with two horizontal ridges hinting at a stack of blynai (pancakes). The primary logo lockup.<\u002Fp>\n        <\u002Fdiv><\u002Fdiv>\n        <div class=\"card\"><div class=\"cbody\">\n          <div class=\"ic\" style=\"background:var(--green-wash);box-shadow:0 0 0 1px var(--green-glow)\"><i data-lucide=\"badge-check\" class=\"lucide\" style=\"color:var(--green)\"><\u002Fi><\u002Fdiv>\n          <h3>The fund seal<\u002Fh3>\n          <p>Concentric gold rings + a green “micro” core. Appears on approved decisions — a wax-seal of risk sign-off with a slowly rotating dashed ring.<\u002Fp>\n        <\u002Fdiv><\u002Fdiv>\n        <div class=\"card\"><div class=\"cbody\">\n          <div class=\"ic\" style=\"background:rgba(245,184,79,0.09);box-shadow:0 0 0 1px rgba(245,184,79,0.24)\"><i data-lucide=\"radar\" class=\"lucide\" style=\"color:var(--gold-soft)\"><\u002Fi><\u002Fdiv>\n          <h3>Pancake field<\u002Fh3>\n          <p>Repeating radial dots + oversized ring outlines drift behind hero areas — coin stacks seen from above, radar sweeps, warm depth.<\u002Fp>\n        <\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"grid g3\" style=\"margin-top:16px\">\n        <div class=\"motif m-dots\"><span class=\"cap\">--pancake-field · dot lattice<\u002Fspan><\u002Fdiv>\n        <div class=\"motif m-rings\"><div class=\"seal\"><i data-lucide=\"trending-up\" class=\"lucide\"><\u002Fi><\u002Fdiv><span class=\"cap\">Fund seal<\u002Fspan><\u002Fdiv>\n        <div class=\"motif m-glow\"><span class=\"orb gd\"><\u002Fspan><span class=\"orb g\"><\u002Fspan><span class=\"cap\">Butter-gold coin glows<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- VOICE -->\n  <section>\n    <div class=\"wrap\">\n      <span class=\"kicker\"><i data-lucide=\"message-square-quote\" class=\"lucide\"><\u002Fi>Content<\u002Fspan>\n      <h2>Voice &amp; tone<\u002Fh2>\n      <p class=\"lede\">Write like a precise quant with a dry sense of humor. Compact, factual, lower-case-friendly labels; every claim is traceable. The fund is absurd; the engineering is not.<\u002Fp>\n      <div class=\"grid g2\" style=\"margin-top:24px\">\n        <div class=\"spec\">\n          <div class=\"tag\">Principles<\u002Fdiv>\n          <div class=\"voice-list\">\n            <div class=\"vi\"><i data-lucide=\"check\" class=\"lucide\"><\u002Fi><span><b>Traceable over persuasive.<\u002Fb> Show the number and where it came from — “€4.10 of €5.00 cap · 82%”.<\u002Fspan><\u002Fdiv>\n            <div class=\"vi\"><i data-lucide=\"check\" class=\"lucide\"><\u002Fi><span><b>Compact.<\u002Fb> Short verdicts, mono labels, no marketing paragraphs. “BUY / LONG micro”.<\u002Fspan><\u002Fdiv>\n            <div class=\"vi\"><i data-lucide=\"check\" class=\"lucide\"><\u002Fi><span><b>Quiet wit.<\u002Fb> Fund absurdity lives in names (“Meme-Finance Lab”), never in the data.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"spec\">\n          <div class=\"tag\">Avoid<\u002Fdiv>\n          <div class=\"voice-list\">\n            <div class=\"vi no\"><i data-lucide=\"x\" class=\"lucide\"><\u002Fi><span><b>Hype &amp; emoji.<\u002Fb> No 🚀, no “to the moon”, no casino energy.<\u002Fspan><\u002Fdiv>\n            <div class=\"vi no\"><i data-lucide=\"x\" class=\"lucide\"><\u002Fi><span><b>Cartoon pancakes.<\u002Fb> Motifs stay abstract and geometric.<\u002Fspan><\u002Fdiv>\n            <div class=\"vi no\"><i data-lucide=\"x\" class=\"lucide\"><\u002Fi><span><b>Vague adjectives.<\u002Fb> Prefer a figure and a unit over “strong” or “huge”.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- COLOR -->\n  <section>\n    <div class=\"wrap\">\n      <span class=\"kicker\"><i data-lucide=\"palette\" class=\"lucide\"><\u002Fi>Color<\u002Fspan>\n      <h2>Palette<\u002Fh2>\n      <p class=\"lede\">A warm-tinted near-black base carries butter-gold brand accents and four strict trading semantics. Color always means something — never decoration.<\u002Fp>\n\n      <div class=\"kicker\" style=\"margin:34px 0 14px;color:var(--muted)\">Base surfaces<\u002Fdiv>\n      <div class=\"grid g4\">\n        <div class=\"swatch\"><div class=\"chip\" style=\"background:var(--bg-void)\"><\u002Fdiv><div class=\"meta\"><div class=\"nm\">Void<\u002Fdiv><div class=\"hex\">#050505<\u002Fdiv><div class=\"tok\">--bg-void<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"chip\" style=\"background:var(--surface-inset)\"><\u002Fdiv><div class=\"meta\"><div class=\"nm\">Inset well<\u002Fdiv><div class=\"hex\">rgba(7,10,11,.92)<\u002Fdiv><div class=\"tok\">--surface-inset<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"chip\" style=\"background:#12130f\"><\u002Fdiv><div class=\"meta\"><div class=\"nm\">Panel<\u002Fdiv><div class=\"hex\">rgba(17,18,15,.92)<\u002Fdiv><div class=\"tok\">--surface-panel<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"chip\" style=\"background:#1c1d17\"><\u002Fdiv><div class=\"meta\"><div class=\"nm\">Elevated<\u002Fdiv><div class=\"hex\">rgba(28,29,23,.96)<\u002Fdiv><div class=\"tok\">--surface-elev<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"kicker\" style=\"margin:26px 0 14px;color:var(--muted)\">Brand — butter gold &amp; cream<\u002Fdiv>\n      <div class=\"grid g4\">\n        <div class=\"swatch\"><div class=\"chip\" style=\"background:var(--gold)\"><\u002Fdiv><div class=\"meta\"><div class=\"nm\">Gold<\u002Fdiv><div class=\"hex\">#F5B84F<\u002Fdiv><div class=\"tok\">--gold<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"chip\" style=\"background:var(--gold-soft)\"><\u002Fdiv><div class=\"meta\"><div class=\"nm\">Gold soft<\u002Fdiv><div class=\"hex\">#FFD987<\u002Fdiv><div class=\"tok\">--gold-soft<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"chip\" style=\"background:var(--cream)\"><\u002Fdiv><div class=\"meta\"><div class=\"nm\">Cream<\u002Fdiv><div class=\"hex\">#F7E6C1<\u002Fdiv><div class=\"tok\">--cream<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"chip\" style=\"background:var(--ink)\"><\u002Fdiv><div class=\"meta\"><div class=\"nm\">Ink<\u002Fdiv><div class=\"hex\">#F6EFE1<\u002Fdiv><div class=\"tok\">--ink<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"kicker\" style=\"margin:26px 0 14px;color:var(--muted)\">Semantic — trading signals<\u002Fdiv>\n      <div class=\"grid g4\">\n        <div class=\"swatch\"><div class=\"chip\" style=\"background:var(--green)\"><\u002Fdiv><div class=\"meta\"><div class=\"nm\">Green<\u002Fdiv><div class=\"hex\">#41EDA0<\u002Fdiv><div class=\"tok\">--green<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"chip\" style=\"background:var(--red)\"><\u002Fdiv><div class=\"meta\"><div class=\"nm\">Red<\u002Fdiv><div class=\"hex\">#FF5367<\u002Fdiv><div class=\"tok\">--red<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"chip\" style=\"background:var(--amber)\"><\u002Fdiv><div class=\"meta\"><div class=\"nm\">Amber<\u002Fdiv><div class=\"hex\">#F0A63A<\u002Fdiv><div class=\"tok\">--amber<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"chip\" style=\"background:var(--blue)\"><\u002Fdiv><div class=\"meta\"><div class=\"nm\">Blue<\u002Fdiv><div class=\"hex\">#6FAEFF<\u002Fdiv><div class=\"tok\">--blue<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"sem\">\n        <div class=\"sem-row\"><span class=\"tag\" style=\"color:var(--green)\"><span class=\"dot\" style=\"background:var(--green)\"><\u002Fspan>Green<\u002Fspan><span class=\"desc\"><b>Profit · long · approved · OK.<\u002Fb> Buy verdicts, passed risk checks, positive score bars, filled orders.<\u002Fspan><\u002Fdiv>\n        <div class=\"sem-row\"><span class=\"tag\" style=\"color:var(--red)\"><span class=\"dot\" style=\"background:var(--red)\"><\u002Fspan>Red<\u002Fspan><span class=\"desc\"><b>Loss · rejected · error · kill switch.<\u002Fb> Negative score contributions, blocked checks, the armed kill switch.<\u002Fspan><\u002Fdiv>\n        <div class=\"sem-row\"><span class=\"tag\" style=\"color:var(--amber)\"><span class=\"dot\" style=\"background:var(--amber)\"><\u002Fspan>Amber<\u002Fspan><span class=\"desc\"><b>Warning · cooldown · risk attention.<\u002Fb> Fees, throttles, near-limit gauges, EMA21 slow line.<\u002Fspan><\u002Fdiv>\n        <div class=\"sem-row\"><span class=\"tag\" style=\"color:var(--blue)\"><span class=\"dot\" style=\"background:var(--blue)\"><\u002Fspan>Blue<\u002Fspan><span class=\"desc\"><b>Info · hold · neutral.<\u002Fb> EMA9 fast line, low-weight AI signals, informational chips.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- TYPE -->\n  <section>\n    <div class=\"wrap\">\n      <span class=\"kicker\"><i data-lucide=\"type\" class=\"lucide\"><\u002Fi>Type<\u002Fspan>\n      <h2>Typography<\u002Fh2>\n      <p class=\"lede\">Three roles: Space Grotesk for display &amp; UI titles, IBM Plex Sans for body, IBM Plex Mono for every number and machine label — always tabular so digits align in tables and charts.<\u002Fp>\n      <div class=\"spec\" style=\"margin-top:26px\">\n        <div class=\"tag\">Space Grotesk · Display<\u002Fdiv>\n        <div class=\"display\">Decision Explanation<\u002Fdiv>\n        <div class=\"row2\"><span>weights 400 / 500 / 600 / 700<\u002Fspan><span>letter-spacing −0.02em on headlines<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"spec\">\n        <div class=\"tag\">IBM Plex Sans · Body<\u002Fdiv>\n        <div class=\"bodyt\">EMA9 turned above EMA21 inside a bullish regime. RSI is constructive, volume confirms, and risk only allows a micro-sized entry — so the bot buys one tiny position and keeps every input replayable.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"spec\">\n        <div class=\"tag\">IBM Plex Mono · Numbers (tabular)<\u002Fdiv>\n        <div class=\"monot\">€68.28 · +0.74 · −0.06 bps · 0.011<\u002Fdiv>\n        <div class=\"row2\"><span>font-variant-numeric: tabular-nums<\u002Fspan><span>used for all data, labels, timestamps<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"spec\">\n        <div class=\"tag\">Type scale<\u002Fdiv>\n        <div class=\"scale\">\n          <div><span class=\"lab\">62–76px<\u002Fspan><span class=\"ex\" style=\"font-size:34px\">Hero brand<\u002Fspan><\u002Fdiv>\n          <div><span class=\"lab\">34px / h2<\u002Fspan><span class=\"ex\" style=\"font-size:26px\">Section title<\u002Fspan><\u002Fdiv>\n          <div><span class=\"lab\">19px / h3<\u002Fspan><span class=\"ex\" style=\"font-size:19px\">Panel heading<\u002Fspan><\u002Fdiv>\n          <div><span class=\"lab\">14–15px<\u002Fspan><span class=\"ex\" style=\"font-size:15px\">Body copy<\u002Fspan><\u002Fdiv>\n          <div><span class=\"lab\">11px mono<\u002Fspan><span class=\"ex\" style=\"font-size:11px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.1em;color:var(--gold-soft)\">Eyebrow label<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- EFFECTS -->\n  <section>\n    <div class=\"wrap\">\n      <span class=\"kicker\"><i data-lucide=\"sparkle\" class=\"lucide\"><\u002Fi>Foundations<\u002Fspan>\n      <h2>Radius, glow &amp; depth<\u002Fh2>\n      <p class=\"lede\">Panels use a tight 8px radius and deep soft shadows for a rack-mounted feel. Semantic glows echo the trading colors — a 1px colored ring plus a soft bloom.<\u002Fp>\n      <div class=\"grid g2\" style=\"margin-top:26px\">\n        <div class=\"motif m-glow\"><span class=\"orb g\"><\u002Fspan><span class=\"orb r\"><\u002Fspan><span class=\"orb a\"><\u002Fspan><span class=\"orb b\"><\u002Fspan><span class=\"cap\">Semantic glows · --glow-green/red/amber/blue<\u002Fspan><\u002Fdiv>\n        <div class=\"spec\" style=\"display:grid;place-content:center;gap:14px\">\n          <div style=\"display:flex;gap:14px;align-items:flex-end\">\n            <div style=\"width:70px;height:52px;border-radius:6px;background:var(--surface-elev);border:1px solid var(--hairline)\"><\u002Fdiv>\n            <div style=\"width:70px;height:52px;border-radius:8px;background:var(--surface-elev);border:1px solid var(--hairline)\"><\u002Fdiv>\n            <div style=\"width:70px;height:52px;border-radius:12px;background:var(--surface-elev);border:1px solid var(--hairline)\"><\u002Fdiv>\n            <div style=\"width:70px;height:52px;border-radius:999px;background:var(--surface-elev);border:1px solid var(--hairline)\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"row2\" style=\"justify-content:center;gap:30px\"><span>6<\u002Fspan><span>8 · panel<\u002Fspan><span>12<\u002Fspan><span>pill<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- COMPONENTS -->\n  <section>\n    <div class=\"wrap\">\n      <span class=\"kicker\"><i data-lucide=\"component\" class=\"lucide\"><\u002Fi>Patterns<\u002Fspan>\n      <h2>Components in context<\u002Fh2>\n      <p class=\"lede\">The core terminal vocabulary — status pills, the kill switch, risk nodes, and signed score bars. All draw from the same tokens.<\u002Fp>\n      <div class=\"demo\" style=\"margin-top:26px\">\n        <span class=\"pill ok\"><span class=\"dot\"><\u002Fspan>Bot Running<\u002Fspan>\n        <span class=\"pill info\"><span class=\"dot\"><\u002Fspan>Hold<\u002Fspan>\n        <span class=\"pill warn\"><span class=\"dot\"><\u002Fspan>Cooldown<\u002Fspan>\n        <span class=\"pill\"><span class=\"dot\"><\u002Fspan>Trading212 Off<\u002Fspan>\n        <button class=\"kill\"><span class=\"ring\"><\u002Fspan>Kill Switch<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"demo\" style=\"margin-top:16px\">\n        <span class=\"rdot\"><i data-lucide=\"check\" class=\"lucide\"><\u002Fi><\u002Fspan>\n        <span style=\"font-family:var(--font-display);font-size:13px\">MaxPositionSize<\u002Fspan>\n        <span class=\"num\" style=\"color:var(--muted);font-size:12px\">€4.10 / €5.00 · 82%<\u002Fspan>\n        <div class=\"scorebar\"><span class=\"mid\"><\u002Fspan><span class=\"fill\"><\u002Fspan><\u002Fdiv>\n        <span class=\"num\" style=\"color:var(--green-bright);font-size:14px\">+0.34<\u002Fspan>\n      <\u002Fdiv>\n      <a class=\"cta\" href=\"../ui_kits/terminal/index.html\"><i data-lucide=\"arrow-up-right\" class=\"lucide\"><\u002Fi>Open the Decision Explanation cockpit<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer>\n    <div class=\"wrap\">\n      <span>Blynai Capital · Design Guide · v1<\u002Fspan>\n      <span>Space Grotesk · IBM Plex Sans · IBM Plex Mono · Lucide icons<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n\n\n<script>lucide.createIcons();<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
