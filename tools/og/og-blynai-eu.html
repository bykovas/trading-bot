<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<title>blynai.eu OG 5b — 1200×630</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Kortelė yra lygiai 1200×630. Jokių viewport vienetų, jokio responsive:
     šis failas egzistuoja tik tam, kad būtų nufotografuotas į og.png. */
  html,body{margin:0;padding:0;background:#fff}
  .og{position:relative;width:1200px;height:630px;overflow:hidden;background:
    radial-gradient(820px 520px at 2% 0%,rgba(245,184,79,.24),transparent 68%),
    radial-gradient(760px 560px at 100% 100%,rgba(107,78,219,.20),transparent 70%),
    #FBF8F2}
  /* Aukso -> violetinės ašis, ta pati kaip po puslapio topbar'u. */
  .og-rule{position:absolute;inset:0 0 auto 0;height:6px;
    background:linear-gradient(90deg,#F5B84F,#C98F63 42%,#8C6BC9 74%,#6B4EDB)}
  .og-lock{position:absolute;top:60px;left:64px;display:flex;align-items:center;gap:18px}
  .og-mark{width:64px;height:64px;flex:none;display:grid;place-items:center;border-radius:18px;
    background:#0A0A0A;border:1px solid rgba(245,184,79,.34);box-shadow:0 0 32px rgba(245,184,79,.18)}
  .og-mark svg{width:46px;height:46px}
  .og-name{display:flex;flex-direction:column;gap:5px}
  .og-name b{font:600 27px/1 "Space Grotesk",sans-serif;color:#1A1712;white-space:nowrap}
  .og-name b i{font-style:normal;color:#B97F2E}
  .og-name small{font:13px "IBM Plex Mono",monospace;text-transform:uppercase;
    letter-spacing:.18em;color:#6B4EDB;white-space:nowrap}
  /* Dvi eilutės, po vieną sakinį. Eilučių skaičius fiksuotas <br>, ne auto-wrap. */
  .og-h{position:absolute;left:64px;top:196px;width:1072px;margin:0;
    font:400 52px/1.14 "Space Grotesk",sans-serif;letter-spacing:-.035em;color:#1A1712}
  /* 5b: antros eilutės gradientas APVERSTAS — violetinė kairėje, auksas dešinėje. */
  .og-h em{font-style:normal;color:#6B4EDB;
    background:linear-gradient(96deg,#6B4EDB,#B97F2E);
    -webkit-background-clip:text;background-clip:text}
  @supports ((-webkit-background-clip:text) or (background-clip:text)){
    .og-h em{color:transparent}
  }
  .og-band{position:absolute;left:0;bottom:0;width:1200px;height:190px}
  .og-foot{position:absolute;left:64px;right:64px;bottom:172px;display:flex;
    align-items:baseline;justify-content:space-between;gap:24px;
    font:16px "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#8A8175}
  .og-foot p{margin:0}
</style>
</head>
<body>
<div class="og" id="og">
  <div class="og-rule"></div>

  <div class="og-lock">
    <span class="og-mark"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><defs><linearGradient id="ogm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD987"/><stop offset="1" stop-color="#F5B84F"/></linearGradient></defs><path d="M16.5 9 L8.5 20 L16.5 31" stroke="url(#ogm)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M23.5 9 L31.5 20 L23.5 31" stroke="url(#ogm)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17" cy="17.5" r="2.1" fill="#FFD987"/><circle cx="23" cy="17.5" r="2.1" fill="#C8963B"/><circle cx="17" cy="22.5" r="2.1" fill="#C8963B"/><circle cx="23" cy="22.5" r="2.1" fill="#FFD987"/></svg></span>
    <span class="og-name"><b>Blyn<i>AI</i> Capital</b><small>L&amp;D Finance Lab</small></span>
  </div>

  <p class="og-h">Algoritminė prekyba kriptovaliutomis.<br><em>Tyrimai, inovacijos, sprendimai.</em></p>

  <svg class="og-band" viewBox="0 0 1200 190" aria-hidden="true">
    <defs>
      <linearGradient id="eq" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#F5B84F"/><stop offset=".55" stop-color="#C98F63"/><stop offset="1" stop-color="#6B4EDB"/></linearGradient>
      <linearGradient id="eqf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="rgba(245,184,79,.22)"/><stop offset="1" stop-color="rgba(107,78,219,.18)"/></linearGradient>
    </defs>
    <path d="M0 150 L100 140 L190 156 L290 120 L380 134 L480 96 L570 112 L670 72 L760 88 L860 50 L950 66 L1060 26 L1130 40 L1200 8 L1200 190 L0 190 Z" fill="url(#eqf)"/>
    <path d="M0 150 L100 140 L190 156 L290 120 L380 134 L480 96 L570 112 L670 72 L760 88 L860 50 L950 66 L1060 26 L1130 40 L1200 8" fill="none" stroke="url(#eq)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>

  <div class="og-foot"><p>blynai.eu</p><p>MB &#8222;BlynAI&#8220; &#183; Lietuva</p></div>
</div>
</body>
</html>
