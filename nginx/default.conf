# One static file is served on three hostnames, and each needs its own share card.
# Crawlers do not run JavaScript, so the tags cannot be swapped on the client —
# nginx substitutes them per $host on the way out.
#
# The placeholders live in public/index.html. Every one of them is replaced below
# for every host, including the default, so a token can never reach a visitor.
# The image tags are the exception: they carry a revision that changes when the
# figures on the card change, which nginx cannot work out on its own, so they
# come from the renderer through an SSI include (see below).

map $host $og_url {
    default             "https://fin.bykovas.lt/";
    # blynai.eu is the LUKO dashboard under the project's own name: same page, same
    # card, same words. Only the canonical is its own - a domain that declares another
    # host canonical is telling search engines and shares to consolidate elsewhere,
    # which is the opposite of what a brand's own domain is for.
    blynai.eu           "https://blynai.eu/";
    blynai.meetluko.eu  "https://blynai.meetluko.eu/";
    blynai.bykovas.lt   "https://blynai.bykovas.lt/";
}

map $host $og_site {
    blynai.eu           "LUKO · BlynAI Capital";
    default             "BlynAI Capital";
    blynai.meetluko.eu  "LUKO · BlynAI Capital";
    blynai.bykovas.lt   "BYKO · BlynAI Capital";
}

map $host $og_title {
    blynai.eu           "LUKO — botas prekiauja. Mes uždirbam. Kol kas.";
    default             "BlynAI Capital — botas, kuris prekiauja pats. Gyvas žurnalas.";
    blynai.meetluko.eu  "LUKO — botas prekiauja. Mes uždirbam. Kol kas.";
    blynai.bykovas.lt   "BYKO — botas prekiauja. Mes uždirbam. Kol kas.";
}

map $host $og_description {
    blynai.eu           "Botas pats atidaro ir uždaro pozicijas Kraken biržoje, pats valdo riziką. Uždaras testavimas, tikri pinigai, kiekvienas sprendimas įrašytas.";
    default             "Autonominis prekybos botas Kraken biržoje. Prekiauja tik mūsų pačių lėšomis. Gyvi skaičiai — ir raudonos dienos. Prisijungti negalima. Paklausti — galima.";
    blynai.meetluko.eu  "Botas pats atidaro ir uždaro pozicijas Kraken biržoje, pats valdo riziką. Uždaras testavimas, tikri pinigai, kiekvienas sprendimas įrašytas.";
    blynai.bykovas.lt   "Botas pats atidaro ir uždaro pozicijas Kraken biržoje, pats valdo riziką. Uždaras testavimas, tikri pinigai, kiekvienas sprendimas įrašytas.";
}

map $host $og_twitter_card {
    blynai.eu           "summary_large_image";
    default             "summary";
    blynai.meetluko.eu  "summary_large_image";
    blynai.bykovas.lt   "summary_large_image";
}

# Which card belongs to which host. fin.bykovas.lt gets none: both cards are
# instance-branded and neither may stand in for the shared entry point.
map $host $og_theme {
    blynai.eu           "luko";
    default             "";
    blynai.meetluko.eu  "luko";
    blynai.bykovas.lt   "byko";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # sub_filter rewrites the body, so the stored Content-Length no longer applies.
    sub_filter_once off;

    # Docker's embedded DNS. The renderer's address is resolved per request from a
    # variable rather than at startup: with a literal upstream name, nginx refuses
    # to start at all while that container is still coming up, and the whole site
    # would wait on the share card.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        # sub_filter rewrites the body, so nginx drops Last-Modified and ETag: the
        # stored validators no longer describe what is sent. With no validator and
        # no Cache-Control either, a browser falls back to heuristic caching and
        # keeps serving yesterday's page - a phone showed the previous card layout
        # for a quarter of an hour after the deploy while every server involved had
        # the new one. The page is a live dashboard; it must always be revalidated.
        add_header Cache-Control "no-cache, must-revalidate";

        # The og:image tags are fetched from the renderer as the page goes out. An
        # SSI include, not a sub_filter, because the tags are not a constant: the
        # URL in them carries a revision of the figures, so a platform that caches
        # og:image for days refetches when the number moves and only then. Errors
        # are silent - a page without a share card still works, a page with an
        # nginx error printed in its head does not.
        ssi on;
        ssi_silent_errors on;

        sub_filter '__OG_URL__'          $og_url;
        sub_filter '__OG_SITE__'         $og_site;
        sub_filter '__OG_TITLE__'        $og_title;
        sub_filter '__OG_DESCRIPTION__'  $og_description;
        sub_filter '__OG_TWITTER_CARD__' $og_twitter_card;
        try_files $uri $uri/ =404;
    }

    # The include target. Internal, so nothing outside can ask for it, and short
    # timeouts: the page must not wait on the renderer. A host with no card of its
    # own returns nothing at all rather than someone else's picture.
    location = /og/tags {
        internal;
        if ($og_theme = "") { return 204; }
        set $og_upstream "og:8090";
        proxy_pass http://$og_upstream/og/tags?theme=$og_theme&origin=https://$host;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
        proxy_send_timeout 2s;
    }

    # The card itself. Public: this is what og:image points at.
    location /og/ {
        set $og_upstream "og:8090";
        proxy_pass http://$og_upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }

    # The share card used to be a file at these two paths, and everything that
    # scraped the site before 2026-08-23 still asks for them - Facebook holds an
    # og:image for days. They now carry no figures at all, because their only job
    # left is to be the renderer's fallback, so an old cache would show a card
    # with the numbers missing. Send them to the live card instead.
    # Absolute https, not a bare path: TLS ends at Traefik, so nginx sees http and
    # would build the redirect with that scheme - sending a crawler through an
    # extra hop, and through one that some of them refuse as a downgrade.
    # Five minutes, because a redirect nobody bounded is one Cloudflare holds for
    # days: the first version of this rule pointed at http and stayed cached long
    # after it was fixed.
    location = /assets/og-algo-1200x630.png {
        add_header Cache-Control "public, max-age=300";
        return 301 https://$host/og/card.png?theme=luko;
    }
    location = /assets/og-algo-byko-1200x630.png {
        add_header Cache-Control "public, max-age=300";
        return 301 https://$host/og/card.png?theme=byko;
    }

    # Everything else under /assets/ is content-addressed by ?v= and can be
    # cached hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
