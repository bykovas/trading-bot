# One static file is served on three hostnames, and each needs its own share card.
# Crawlers do not run JavaScript, so the tags cannot be swapped on the client —
# nginx substitutes them per $host on the way out.
#
# The placeholders live in public/index.html. Every one of them is replaced below
# for every host, including the default, so a token can never reach a visitor.
# The image block is a comment there, not bare text: text in <head> ends the head
# and prints on the page, so an unsubstituted token would be visible.

map $host $og_url {
    default           "https://fin.bykovas.lt/";
    algo.meetluko.eu  "https://algo.meetluko.eu/";
    algo.bykovas.lt   "https://algo.bykovas.lt/";
}

map $host $og_site {
    default           "BlynAI Capital";
    algo.meetluko.eu  "LUKO ALGO";
    algo.bykovas.lt   "BYKO ALGO";
}

map $host $og_title {
    default           "BlynAI Capital — botas, kuris prekiauja pats. Gyvas žurnalas.";
    algo.meetluko.eu  "LUKO ALGO — botas prekiauja. Mes uždirbam. Kol kas.";
    algo.bykovas.lt   "ALGO — botas prekiauja. Mes uždirbam. Kol kas.";
}

map $host $og_description {
    default           "Autonominis prekybos botas Kraken biržoje. Prekiauja tik mūsų pačių lėšomis. Gyvi skaičiai — ir raudonos dienos. Prisijungti negalima. Paklausti — galima.";
    algo.meetluko.eu  "Botas pats atidaro ir uždaro pozicijas Kraken biržoje, pats valdo riziką. Uždaras testavimas, tikri pinigai, kiekvienas sprendimas įrašytas.";
    algo.bykovas.lt   "Botas pats atidaro ir uždaro pozicijas Kraken biržoje, pats valdo riziką. Uždaras testavimas, tikri pinigai, kiekvienas sprendimas įrašytas.";
}

# The whole image block is one substitution so a host without an approved card
# emits no og:image at all, rather than an empty one. fin.bykovas.lt has no card
# of its own: both instance cards are instance-branded and must not stand in for
# it. Each ?v= must be raised when its PNG changes, or Facebook serves the old
# one from cache forever.
map $host $og_image_tags {
    default           "";
    algo.meetluko.eu  '<meta property="og:image" content="https://algo.meetluko.eu/assets/og-algo-1200x630.png?v=1"><meta property="og:image:type" content="image/png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="LUKO ALGO — botas, kuris prekiauja pats"><meta name="twitter:image" content="https://algo.meetluko.eu/assets/og-algo-1200x630.png?v=1">';
    algo.bykovas.lt   '<meta property="og:image" content="https://algo.bykovas.lt/assets/og-algo-byko-1200x630.png?v=1"><meta property="og:image:type" content="image/png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="BYKO ALGO — botas, kuris prekiauja pats"><meta name="twitter:image" content="https://algo.bykovas.lt/assets/og-algo-byko-1200x630.png?v=1">';
}

map $host $og_twitter_card {
    default           "summary";
    algo.meetluko.eu  "summary_large_image";
    algo.bykovas.lt   "summary_large_image";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # sub_filter rewrites the body, so the stored Content-Length no longer applies.
    sub_filter_once off;

    location / {
        sub_filter '__OG_URL__'          $og_url;
        sub_filter '__OG_SITE__'         $og_site;
        sub_filter '__OG_TITLE__'        $og_title;
        sub_filter '__OG_DESCRIPTION__'  $og_description;
        sub_filter '<!--__OG_IMAGE_TAGS__-->' $og_image_tags;
        sub_filter '__OG_TWITTER_CARD__' $og_twitter_card;
        try_files $uri $uri/ =404;
    }

    # The card is immutable per ?v= revision, so it can be cached hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
